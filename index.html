<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<title>Palestra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B93D0B'/%3E%3Cpath d='M14 32h36M20 22v20M44 22v20M14 26v12M50 26v12' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F4F0;--card:#FFFFFF;--line:#E4E2DC;--ink:#17191E;--mut:#5A5F69;--mut2:#3F444D;
  --acc:#B93D0B;--acc-h:#8F2E07;--acc-soft:#FBEBE2;--ok:#2E7D4F;--ok-ink:#1F6B40;--ok-soft:#E5F2EA;
  --t-acc:#F08A5D;--in:#C9C6BE;--chip:#EEEDE8;--seg:#E9E7E1;--thumb:#2A2D34;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
a{color:var(--acc)} a:hover{color:var(--acc-h)}
button{appearance:none;-webkit-appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid rgba(185,61,11,.45);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}

.scr{padding:28px 20px calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.scr.sub{padding:20px 20px calc(32px + env(safe-area-inset-bottom));gap:14px}
.scr.sub.nav{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.scr.center{min-height:100vh;min-height:100dvh;justify-content:center;padding-bottom:28px}
.head{display:flex;flex-direction:column;gap:2px}
.date{font-size:13px;color:var(--mut);font-weight:600}
h1.big{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.sm{border-radius:14px;padding:12px 14px;gap:4px}
.eyebrow{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.grp{margin:6px 0 0;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.muted{color:var(--mut)}
.txt{margin:0;font-size:15px;line-height:1.45;color:var(--mut2)}
.hint{margin:0;font-size:13px;color:var(--mut);font-weight:600}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.banner{background:var(--chip);color:var(--mut2);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.4}

/* settimana e giorni */
.weekbar{display:grid;gap:6px}
.weekbar span{height:6px;border-radius:3px;background:var(--line)}
.weekbar .past{background:var(--ink)} .weekbar .cur{background:var(--acc)}
.days{display:grid;gap:10px}
.day{background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px}
.day .l{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--mut);line-height:1.1}
.day .s{font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:4px}
.day.done{background:var(--ok-soft)} .day.done .l,.day.done .s{color:var(--ok-ink);font-weight:700}
.day.sel{background:#fff;border-color:var(--acc)} .day.sel .l,.day.sel .s{color:var(--acc);font-weight:700}
.day.done.sel{background:var(--ok-soft)} .day.done.sel .l,.day.done.sel .s{color:var(--ok-ink)}
.tag-scarico{align-self:flex-start;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px}

/* pulsanti */
.cta{background:var(--acc);color:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:64px}
.cta .t{display:block;font-size:19px;font-weight:800}
.cta .st{display:block;font-size:13px;font-weight:500;color:#FBE3D6;margin-top:2px}
.link-row{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer}
.link-row:hover{color:var(--ink)}
.link-row .tx{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.link-row .t{font-size:16px;font-weight:700}
.link-row .st{font-size:13px;color:var(--mut)}
.ic{width:44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic.neutral{background:var(--chip);color:var(--mut2)}
.btn-out{border:2px solid var(--ink);border-radius:14px;padding:12px;text-align:center;font-size:15px;font-weight:700;width:100%;min-height:48px}
.btn-txt{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--mut);text-decoration:underline;padding:8px;min-height:40px;width:100%}
.btn-pri{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:16px;padding:15px;text-align:center;font-size:16px;font-weight:800;width:100%;min-height:52px}
.btn-dark{background:var(--ink);color:#fff;border-radius:18px;padding:18px;text-align:center;font-size:17px;font-weight:800;width:100%;min-height:56px}
.btn-sec{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:15px;font-weight:700;width:100%;min-height:48px;cursor:pointer}
.btn-danger{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid #E7C2B1;color:#A3320A;border-radius:14px;padding:12px;font-size:15px;font-weight:700;width:100%;min-height:48px}
.btn-danger.full{background:#A3320A;color:#fff;border-color:#A3320A;border-radius:16px;min-height:52px;font-weight:800}
.btn-dash{border:2px dashed var(--in);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--mut2);width:100%;min-height:52px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);text-decoration:none}
.iconbtn.plain{background:none;border:0;color:var(--mut)}
.pill-btn{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;flex-shrink:0}

/* barra in alto delle schermate interne */
.topbar{display:flex;align-items:center;gap:8px}
.topbar .tt{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.topbar h1{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.topbar .sub{font-size:13px;color:var(--mut);font-weight:600}
.topbar .lbl-top{font-size:13px;color:var(--mut);font-weight:700;flex-grow:1;min-width:0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress div{height:6px;background:var(--ok)}

/* card esercizio */
.ex{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.ex.cur{border:2px solid var(--acc);padding:11px}
.ex.done{opacity:.85}
.ex.skip{opacity:.6}
.ex .body{display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0;text-align:left;align-self:stretch;justify-content:center}
.ex .n{font-size:15px;font-weight:700}
.ex .m{font-size:13px;color:var(--mut);font-weight:600}
.ex .tn{font-size:12.5px;color:var(--mut);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ex .tn b{color:var(--mut2)}
.ex .vlink{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;text-decoration:none;align-self:flex-start;padding:4px 0}
.ord{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.ord button{width:36px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.thumb{width:84px;height:64px;border-radius:10px;background:var(--thumb);flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img,.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pl{position:relative;width:30px;height:30px;border-radius:15px;background:rgba(23,25,30,.55);display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--chip);color:var(--mut2)}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)} .chip.acc{background:var(--acc-soft);color:var(--acc)}

/* esercizio in corso */
.video{border-radius:16px;background:var(--thumb);height:190px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#D6D8DD;text-decoration:none}
.video .pl{position:relative;width:60px;height:60px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.vlink-big{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;text-decoration:none;margin-top:-4px;min-height:32px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.stat .x{font-size:11px;color:var(--mut);font-weight:600}
.k-up{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}

.timer{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:background-color .3s}
.timer .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.timer .dots i{width:10px;height:10px;border-radius:5px;background:#4A4E57}
.timer .dots i.f{background:#fff} .timer .dots i.c{background:var(--t-acc)}
.timer .undo{font-size:12px;font-weight:700;color:#B5B8BF;text-decoration:underline;padding:6px 4px}
.tbtn{width:48px;height:48px;border-radius:24px;border:1px solid #4A4E57;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#D6D8DD;flex-shrink:0}
.tmid{display:flex;flex-direction:column;align-items:center;text-align:center}
.tnum{font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tsub{font-size:12px;color:#B5B8BF;font-weight:600}
.tbar{height:6px;border-radius:3px;background:#33363E;overflow:hidden}
.tbar div{height:6px;background:var(--t-acc)}
.tg1{border:1px solid #4A4E57;border-radius:14px;padding:13px;text-align:center;font-size:14px;font-weight:700;min-height:48px}
.tg2{background:#fff;color:var(--ink);border-radius:14px;padding:13px;text-align:center;font-size:14px;font-weight:800;min-height:48px}
.timer.end{background:var(--ok);animation:fine 1.1s ease-out 3}
.timer.end .tsub{color:#fff;font-size:15px;font-weight:800}
.timer.end .tbtn,.timer.end .tg1{border-color:rgba(255,255,255,.5);color:#fff}
.timer.end .tbar{background:rgba(255,255,255,.3)} .timer.end .tbar div{background:#fff}
.timer.end .dots i{background:rgba(255,255,255,.35)} .timer.end .dots i.f{background:#fff} .timer.end .dots i.c{background:#BFE3CC}
.timer.end .undo{color:#E5F2EA}
@keyframes fine{0%{box-shadow:0 0 0 0 rgba(46,125,79,.75)}100%{box-shadow:0 0 0 20px rgba(46,125,79,0)}}
@media (prefers-reduced-motion:reduce){.timer.end{animation:none}}

/* form */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:700;color:var(--mut)}
.inp{width:100%;height:48px;border:1px solid var(--in);border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.inp.big{height:52px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;padding:0 6px}
textarea.inp{height:auto;padding:12px;resize:vertical;line-height:1.4;min-height:72px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:160px}
select.inp{font-weight:700;font-size:15px;padding-right:8px}
.static{height:52px;border-radius:12px;background:var(--chip);color:var(--mut2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-align:center;padding:0 6px}
.rir{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rir button{height:44px;border-radius:12px;border:1px solid var(--in);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.rir button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.err{background:var(--acc-soft);color:var(--acc-h);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45}
.err ul{margin:6px 0 0;padding-left:18px}
.ok-box{background:var(--ok-soft);color:var(--ok-ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45}
.wrow{display:grid;grid-template-columns:52px 1fr 14px 1fr 1.3fr;gap:6px;align-items:center}
.wrow .inp{height:44px;padding:0 8px;text-align:center}
.wrow .inp.nota{text-align:left;font-size:14px}
.wrow span{font-size:13px;font-weight:700;color:var(--mut);text-align:center}
.saved{font-size:12px;color:var(--mut);font-weight:600;min-height:16px}

/* segmented */
.seg{background:var(--seg);border-radius:14px;padding:4px;display:grid;gap:4px}
.seg button{height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mut2);min-width:0;padding:0 4px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:800}
.seg.small button{height:34px;font-size:13px}
.pnav{display:flex;align-items:center;gap:8px}
.pnav .lab{flex-grow:1;text-align:center;font-size:15px;font-weight:800}
.chartbox{position:relative;height:190px}
.empty{font-size:14px;color:var(--mut);font-weight:600;text-align:center;padding:28px 8px;background:var(--bg);border-radius:14px}
.legend{display:flex;gap:16px;font-size:12px;font-weight:600;color:var(--mut2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:480px;margin:0 auto;height:76px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11px;font-weight:600;text-decoration:none}
#nav a[aria-current="page"]{color:var(--acc);font-weight:700}

/* fogli e messaggi */
.ov{position:fixed;inset:0;background:rgba(23,25,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sh h2{margin:0;font-size:20px;font-weight:800}
@media (min-width:560px){.ov{align-items:center;padding:20px}.sh{border-radius:22px}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <main id="main"><div class="scr center"><p class="hint" style="text-align:center">Caricamento…</p></div></main>
  <nav id="nav" hidden aria-label="Navigazione principale"><div class="in">
    <a href="#home" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Oggi</a>
    <a href="#riscaldamento" data-tab="riscaldamento"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Riscaldamento</a>
    <a href="#progressi" data-tab="progressi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-6M12 17V5M18 17v-9"/></svg>Progressi</a>
    <a href="#scheda" data-tab="scheda"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></svg>Scheda</a>
  </div></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="scheda-iniziale">

// ---------- validazione della scheda ----------
function validaScheda(d) {
  const err = [];
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { errori: ['Il file non contiene una scheda: mi aspettavo un oggetto JSON con "settimane" e "giorni".'] };
  const nS = Number(d.settimane);
  if (!Number.isInteger(nS) || nS < 1 || nS > 52) err.push('"settimane" (in cima al file) deve essere un numero intero da 1 a 52.');
  const out = { schemaVersion: 1, nome: str(d.nome) || 'Scheda', obiettivo: str(d.obiettivo), settimane: nS, riscaldamento: [], giorni: [] };
  if (d.riscaldamento != null) {
    if (!Array.isArray(d.riscaldamento)) err.push('"riscaldamento" deve essere un elenco di sezioni.');
    else d.riscaldamento.forEach((s, i) => {
      const dove = `Riscaldamento, sezione ${i + 1}`;
      if (!s || typeof s !== 'object') { err.push(`${dove}: non è valida.`); return; }
      const sez = { sezione: str(s.sezione) || `Sezione ${i + 1}`, esercizi: [] };
      if (!Array.isArray(s.esercizi)) err.push(`${dove} (${sez.sezione}): manca l'elenco "esercizi".`);
      else s.esercizi.forEach((e, j) => {
        if (!e || !str(e.nome)) { err.push(`${dove} (${sez.sezione}), esercizio ${j + 1}: manca il "nome".`); return; }
        sez.esercizi.push({ nome: str(e.nome), prescrizione: str(e.prescrizione), videoUrl: str(e.videoUrl) });
      });
      out.riscaldamento.push(sez);
    });
  }
  if (!Array.isArray(d.giorni) || !d.giorni.length) err.push('"giorni" deve essere un elenco con almeno un giorno (es. A, B, C).');
  else {
    const ids = new Set();
    d.giorni.forEach((g, i) => {
      const id = str(g?.id);
      const dove = `Giorno ${id || i + 1}`;
      if (!id) err.push(`Giorno ${i + 1}: manca l'"id" (es. "A").`);
      else if (ids.has(id)) err.push(`${dove}: l'id "${id}" compare due volte.`);
      ids.add(id);
      const gg = { id: id || String(i + 1), nome: str(g?.nome) || `Giorno ${id || i + 1}`, esercizi: [] };
      if (!Array.isArray(g?.esercizi) || !g.esercizi.length) err.push(`${dove}: deve avere almeno un esercizio in "esercizi".`);
      else g.esercizi.forEach((e, j) => {
        const r = validaEsercizio(e, nS, `${dove}, esercizio ${j + 1}${str(e?.nome) ? ` (${str(e.nome)})` : ''}`, err);
        if (r) gg.esercizi.push(r);
      });
      out.giorni.push(gg);
    });
  }
  return err.length ? { errori: err } : { scheda: out };
}
function validaEsercizio(e, nS, dove, err) {
  if (!e || typeof e !== 'object') { err.push(`${dove}: non è valido.`); return null; }
  const n0 = err.length;
  const nome = str(e.nome);
  if (!nome) err.push(`${dove}: manca il "nome".`);
  const tipo = e.tipoCarico == null || e.tipoCarico === '' ? 'kg' : e.tipoCarico;
  if (!TIPI[tipo]) err.push(`${dove}: "tipoCarico" deve essere "kg", "corpo_libero" oppure "elastico" (c'è scritto "${tipo}").`);
  if (e.perLato != null && typeof e.perLato !== 'boolean') err.push(`${dove}: "perLato" deve essere true oppure false.`);
  const sett = [];
  if (!Array.isArray(e.settimane)) err.push(`${dove}: manca l'elenco "settimane".`);
  else {
    if (Number.isInteger(nS) && e.settimane.length !== nS) err.push(`${dove}: "settimane" deve avere ${nS} elementi, uno per settimana (ne ha ${e.settimane.length}).`);
    e.settimane.forEach((w, k) => {
      const se = Number(w?.serie), ri = Number(w?.ripetizioni);
      if (!Number.isInteger(se) || se < 1) err.push(`${dove}, settimana ${k + 1}: "serie" deve essere un numero intero maggiore di 0.`);
      if (!Number.isInteger(ri) || ri < 1) err.push(`${dove}, settimana ${k + 1}: "ripetizioni" deve essere un numero intero maggiore di 0.`);
      const o = { serie: se, ripetizioni: ri };
      if (str(w?.nota)) o.nota = str(w.nota);
      sett.push(o);
    });
  }
  const rec = e.recuperoSec == null || e.recuperoSec === '' ? 0 : Number(e.recuperoSec);
  if (!Number.isInteger(rec) || rec < 0) err.push(`${dove}: "recuperoSec" deve essere un numero intero di secondi (0 se non indicato).`);
  if (err.length > n0) return null;
  return { nome, categoria: str(e.categoria) || 'Altro', tipoCarico: tipo, perLato: !!e.perLato, settimane: sett, rir: str(e.rir), tempo: str(e.tempo), recuperoSec: rec, note: str(e.note), videoUrl: str(e.videoUrl) };
}
function erroriHtml(errori) {
  const max = 15, extra = errori.length - max;
  return `<div class="err">Ho trovato ${errori.length === 1 ? 'un problema' : errori.length + ' problemi'}:<ul>${errori.slice(0, max).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${extra > 0 ? `<div>…e altri ${extra}.</div>` : ''}</div>`;
}

  return {
    locale: true,
    async carica() { const d = leggi(); return { stato: d.stato || null, sessioni: d.sessioni || [], note: d.note || {} }; },
    async salvaStato(s) { const d = leggi(); d.stato = pulisci(s); scrivi(d); },
    async salvaSessione(s) { const d = leggi(); d.sessioni = (d.sessioni || []).filter(x => x.id !== s.id); d.sessioni.push(pulisci(s)); scrivi(d); },
    async salvaNota(k, v) { const d = leggi(); d.note = d.note || {}; if (v) d.note[k] = v; else delete d.note[k]; scrivi(d); },
    async sostituisciTutto(b) { scrivi(pulisci(b)); },
    async cancellaTutto() { try { localStorage.removeItem(K); } catch { } }
  };
}

let FBX = null;
function creaArchivioFirebase(utente) {
  const { doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch } = FBX.F;
  const db = FBX.db;
  const docStato = doc(db, 'utenti', utente.uid, 'dati', 'stato');
  const colSess = collection(db, 'utenti', utente.uid, 'sessioni');
  const colNote = collection(db, 'utenti', utente.uid, 'noteEsercizi');
  const idNota = k => encodeURIComponent(k).slice(0, 1400) || 'vuoto';
  return {
    locale: false,
    async carica() {
      const [s, ss, nn] = await Promise.all([getDoc(docStato), getDocs(colSess), getDocs(colNote)]);
      const note = {};
      nn.forEach(d => { const v = d.data(); if (v?.nome) note[norm(v.nome)] = v; });
      return { stato: s.exists() ? s.data() : null, sessioni: ss.docs.map(d => d.data()), note };
    },
    salvaStato: s => setDoc(docStato, pulisci(s)),
    salvaSessione: s => setDoc(doc(colSess, s.id), pulisci(s)),
    salvaNota: (k, v) => v ? setDoc(doc(colNote, idNota(k)), pulisci(v)) : deleteDoc(doc(colNote, idNota(k))),
    async sostituisciTutto(b) {
      const [ss, nn] = await Promise.all([getDocs(colSess), getDocs(colNote)]);
      const ops = [];
      ss.forEach(d => ops.push(bt => bt.delete(d.ref)));
      nn.forEach(d => ops.push(bt => bt.delete(d.ref)));
      b.sessioni.forEach(s => ops.push(bt => bt.set(doc(colSess, s.id), pulisci(s))));
      Object.entries(b.note).forEach(([k, v]) => ops.push(bt => bt.set(doc(colNote, idNota(k)), pulisci(v))));
      for (let i = 0; i < ops.length; i += 400) {
        const bt = writeBatch(db);
        ops.slice(i, i + 400).forEach(f => f(bt));
        await bt.commit();
      }
      await setDoc(docStato, pulisci(b.stato));
    }
  };
}

    if (!await conferma({ titolo: 'Fine allenamento', testo: `${nonFatti.length === 1 ? '1 esercizio non registrato verrà salvato' : nonFatti.length + ' esercizi non registrati verranno salvati'} come ${nonFatti.length === 1 ? 'saltato' : 'saltati'}:${nonFatti.map(e => e.nome).join(', ')}.`, ok: 'Salva allenamento' })) return;
  }
  const rec = {
    id: s.id, data: new Date().toISOString(), inizio: s.inizio, giorno: s.giorno, nomeGiorno: s.nomeGiorno, settimana: s.settimana,
    scheda: S.stato.scheda.nome,
    esercizi: fatti.map(e => ({
      nome: e.nome, nomeOriginale: e.nomeOriginale || null, categoria: e.categoria, tipoCarico: e.tipoCarico, perLato: !!e.perLato,
      previsto: { serie: e.serie, ripetizioni: e.ripetizioni, rir: e.rir || '' },
      peso: e.tipoCarico === 'corpo_libero' ? null : e.risultato.peso, serie: e.risultato.serie, ripetizioni: e.risultato.ripetizioni,
      rirPercepito: e.risultato.rir
    })),
    saltati: nonFatti.map(e => e.nome)
  };
  try { await S.archivio.salvaSessione(rec); }
  catch (e) { console.error(e); toast('Non riesco a salvare: controlla la connessione e riprova'); return; }
  S.sessioni.push(rec);
  S.stato.ultimoGiorno = s.giorno;
  if (!S.stato.completati.includes(s.giorno)) S.stato.completati.push(s.giorno);
  S.stato.sessioneInCorso = null; S.giornoScelto = null;
  await scriviStato();
  vai('home'); toast('Allenamento salvato');
};

// ---------- timer di recupero ----------
function statoTimer(e) {
  const t = sess().timer;
  if (!t) return { modo: 'fermo', rest: e.durata, durata: e.durata };
  const rest = Math.max(0, Math.ceil((t.fine - Date.now()) / 1000));
  return { modo: rest > 0 ? 'va' : 'fine', rest, durata: t.durata };
}
function timerHtml(e) {
  const { modo, rest, durata } = statoTimer(e);
  const tot = e.serie, fatte = e.serieFatte, tutte = fatte >= tot;
  const titolo = tutte ? `Serie fatte: ${tot} di ${tot}` : `Serie ${fatte + 1} di ${tot}`;
  const dots = tot <= 12 ? `<span class="dots" aria-hidden="true">${Array.from({ length: tot }, (_, i) => `<i class="${i < fatte ? 'f' : i === fatte ? 'c' : ''}"></i>`).join('')}</span>` : '';
  const sub = modo === 'fermo' ? 'recupero · tocca il tempo per cambiarlo' : modo === 'va' ? `recupero · impostato ${mmss(durata)}` : 'Recupero finito!';
  const larg = modo === 'fermo' ? 100 : modo === 'va' ? Math.round(rest / Math.max(1, durata) * 100) : 100;
  const numero = modo === 'fermo'
    ? `<button class="tnum" data-a="tImposta" data-u="${e.uid}" aria-label="Imposta il recupero, ora ${mmss(rest)}">${mmss(rest)}</button>`
    : `<span class="tnum" role="timer">${mmss(rest)}</span>`;
  return `<div class="timer${modo === 'fine' ? ' end' : ''}" id="timer" data-u="${e.uid}" data-modo="${modo}">
    <div class="between">
      <span style="font-size:15px;font-weight:800">${titolo}</span>
      <span style="display:flex;align-items:center;gap:8px">${fatte > 0 ? `<button class="undo" data-a="serieMeno" data-u="${e.uid}">Annulla serie</button>` : ''}${dots}</span>
    </div>
    <div class="between">
      <button class="tbtn" aria-label="Togli 15 secondi" data-a="tDelta" data-u="${e.uid}" data-d="-15">−15</button>
      <div class="tmid">${numero}<span class="tsub">${sub}</span></div>
      <button class="tbtn" aria-label="Aggiungi 15 secondi" data-a="tDelta" data-u="${e.uid}" data-d="15">+15</button>
    </div>
    <div class="tbar"><div style="width:${larg}%"></div></div>
    <div class="grid2">
      ${modo === 'fermo' ? `<button class="tg1" data-a="tAvvia" data-u="${e.uid}">Avvia recupero</button>` : `<button class="tg1" data-a="tStop">${modo === 'va' ? 'Ferma timer' : 'Chiudi'}</button>`}
      <button class="tg2" data-a="serieFatta" data-u="${e.uid}" ${tutte ? 'disabled' : ''}>${tutte ? 'Serie finite' : 'Serie fatta'}</button>
    </div>
  </div>`;
}
function ridisegnaTimer() { const el = $('#timer'); if (!el) return; const e = esDaUid(el.dataset.u); if (e) el.outerHTML = timerHtml(e); }
function avviaTimer(e) { sess().timer = { fine: Date.now() + e.durata * 1000, durata: e.durata }; salva(); ridisegnaTimer(); }
A.tAvvia = el => avviaTimer(esDaUid(el.dataset.u));
A.tStop = () => { sess().timer = null; salva(); ridisegnaTimer(); };
A.serieFatta = el => { const e = esDaUid(el.dataset.u); if (e.serieFatte < e.serie) e.serieFatte++; avviaTimer(e); };
A.serieMeno = el => { const e = esDaUid(el.dataset.u); if (e.serieFatte > 0) e.serieFatte--; salva(); ridisegnaTimer(); };
A.tDelta = el => {
  const e = esDaUid(el.dataset.u), d = Number(el.dataset.d), s = sess();
  const { modo, rest } = statoTimer(e);
  if (modo === 'va') {
    const nuovo = Math.max(1, rest + d);
    s.timer.fine = Date.now() + nuovo * 1000;
    s.timer.durata = Math.max(s.timer.durata, nuovo);
  } else {
    e.durata = Math.min(3600, Math.max(5, e.durata + d));
    s.timer = null;
  }
  salva(); ridisegnaTimer();
};
A.tImposta = el => {
  const e = esDaUid(el.dataset.u);

function periodoCorrente() {
  const { periodo, offset } = S.prog, ora = new Date();
  let a, b, etichetta, inizio;
  if (periodo === 'settimana') {
    const d = new Date(ora.getFullYear(), ora.getMonth(), ora.getDate());
    a = new Date(d); a.setDate(d.getDate() - (d.getDay() + 6) % 7 + 7 * offset);
    b = new Date(a); b.setDate(a.getDate() + 7);
    const ult = new Date(b); ult.setDate(b.getDate() - 1);
    etichetta = `${dataBreve(a)} – ${dataBreve(ult)} ${ult.getFullYear()}`; inizio = 'Inizio sett.';
  } else if (periodo === 'mese') {
    a = new Date(ora.getFullYear(), ora.getMonth() + offset, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 1);
    etichetta = cap(a.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })); inizio = 'Inizio mese';
  } else {
    a = new Date(ora.getFullYear() + offset, 0, 1); b = new Date(a.getFullYear() + 1, 0, 1);
    etichetta = String(a.getFullYear()); inizio = 'Inizio anno';
  }
  return { a, b, etichetta, inizio };
}
function registrazioni() {
  const out = [];
  for (const s of S.sessioni) {
    const d = new Date(s.data);
    for (const e of s.esercizi || []) out.push({ sid: s.id, data: d, key: norm(e.nome), nome: e.nome, tipo: e.tipoCarico, peso: e.peso, serie: e.serie, rip: e.ripetizioni, rir: e.rirPercepito, rirT: e.previsto?.rir || '' });
  }
  return out.sort((x, y) => x.data - y.data);
}
function unaPerSessione(lista) { const m = new Map(); lista.forEach(r => m.set(r.sid, r)); return [...m.values()]; }
function lunedi(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
let PG = null;
VISTE.progressi = () => {
  const R = registrazioni();
  const per = periodoCorrente();
  const inP = R.filter(r => r.data >= per.a && r.data < per.b);
  const nomi = new Map(); R.forEach(r => nomi.set(r.key, r.nome));
  if (!S.prog.es || !nomi.has(S.prog.es)) S.prog.es = (inP.at(-1) || R.at(-1))?.key || null;
  const es = S.prog.es;
  const gran = S.prog.gran || { settimana: 'allenamento', mese: 'settimana', anno: 'mese' }[S.prog.periodo];

  // peso / ripetizioni
  const recEs = R.filter(r => r.key === es);
  const tipo = recEs.at(-1)?.tipo || 'kg';
  const unita = tipo === 'corpo_libero' ? 'rip' : 'kg';
  const pesoPts = unaPerSessione(inP.filter(r => r.key === es)).map(r => ({ x: dataBreve(r.data), y: tipo === 'corpo_libero' ? r.rip : r.peso })).filter(p => p.y != null);
  const primo = pesoPts[0]?.y, ultimo = pesoPts.at(-1)?.y;
  const varz = pesoPts.length > 1 ? ultimo - primo : null;

  // volume
  const recVol = inP.filter(r => r.tipo === 'kg' && r.peso > 0);
  const gruppi = new Map();
  recVol.forEach(r => {
    let k, lab;
    if (gran === 'allenamento') { k = r.sid; lab = dataBreve(r.data); }
    else if (gran === 'settimana') { const l = lunedi(r.data); k = l.getTime(); lab = dataBreve(l); }
    else { k = r.data.getFullYear() * 12 + r.data.getMonth(); lab = cap(r.data.toLocaleDateString('it-IT', { month: 'short' }).replace('.', '')); }
    const g = gruppi.get(k) || { lab, v: 0 };
    g.v += r.peso * r.rip * r.serie; gruppi.set(k, g);
  });
  const vol = [...gruppi.values()];
  if (gran === 'settimana' && S.prog.periodo === 'mese') vol.forEach((g, i) => g.lab = `Sett. ${i + 1}`);
  const volTot = vol.reduce((t, g) => t + g.v, 0);

  // RIR
  const rirPts = unaPerSessione(inP.filter(r => r.key === es && r.rir != null)).map(r => ({ x: dataBreve(r.data), y: r.rir }));
  const rirT = recEs.at(-1)?.rirT || '';
  const nums = (rirT.match(/\d+(?:[.,]\d+)?/g) || []).map(parseNum);
  const target = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;

  PG = { pesoPts, unita, vol, rirPts, target };
  const nomeEs = es ? nomi.get(es) : '';
  const opz = [...nomi.entries()].sort((a, b) => a[1].localeCompare(b[1], 'it')).map(([k, n]) => `<option value="${esc(k)}"${k === es ? ' selected' : ''}>${esc(n)}</option>`).join('');
  const segP = ['settimana', 'mese', 'anno'].map(p => `<button aria-pressed="${S.prog.periodo === p}" data-a="progPer" data-v="${p}">${cap(p)}</button>`).join('');
  const segG = [['allenamento', 'Allenamento'], ['settimana', 'Settimana'], ['mese', 'Mese']].map(([v, l]) => `<button aria-pressed="${gran === v}" data-a="progGran" data-v="${v}">${l}</button>`).join('');
  const vuoto = m => `<div class="empty">${m}</div>`;
  const colVar = varz == null ? 'inherit' : varz > 0 ? 'var(--ok-ink)' : varz < 0 ? 'var(--acc)' : 'inherit';

  return `<div class="scr" style="gap:16px">
    <div class="head"><h1 class="big">Progressi</h1><span class="date">${R.length ? `${S.sessioni.length} allenamenti registrati in tutto` : 'Ancora nessun allenamento registrato'}</span></div>
    <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))">${segP}</div>
    <div class="pnav">
      <button class="iconbtn" data-a="progNav" data-d="-1" aria-label="Periodo precedente">${ico('chevL')}</button>
      <span class="lab">${esc(per.etichetta)}</span>
      <button class="iconbtn" data-a="progNav" data-d="1" aria-label="Periodo successivo" ${S.prog.offset >= 0 ? 'disabled' : ''}>${ico('chevR')}</button>
    </div>
    ${!R.length ? vuoto('I grafici compariranno dopo il primo allenamento salvato.') : `
    <div class="card">
      <div class="fld" style="gap:6px">
        <label for="prog-es" class="eyebrow" style="letter-spacing:.5px">${tipo === 'corpo_libero' ? 'Ripetizioni per esercizio' : 'Peso per esercizio'}</label>
        <select class="inp" id="prog-es" data-ch="progEs">${opz}</select>
        ${tipo === 'corpo_libero' ? '<span class="hint" style="font-size:12px">Esercizio a corpo libero: il grafico mostra le ripetizioni.</span>' : tipo === 'elastico' ? '<span class="hint" style="font-size:12px">Esercizio con elastico: il grafico mostra i kg dell\'elastico.</span>' : ''}
      </div>
      <div class="grid3" style="gap:8px">
        <div class="head"><span class="date" style="font-size:12px">Ultimo</span><span class="num" style="font-size:26px">${ultimo != null ? fmtN(ultimo) + ' ' + unita : '—'}</span></div>
        <div class="head"><span class="date" style="font-size:12px">${per.inizio}</span><span class="num" style="font-size:26px">${primo != null ? fmtN(primo) + ' ' + unita : '—'}</span></div>
        <div class="head"><span class="date" style="font-size:12px">Variazione</span><span class="num" style="font-size:26px;color:${colVar}">${varz != null ? (varz > 0 ? '+' : '') + fmtN(varz) + ' ' + unita : '—'}</span></div>
      </div>
      ${pesoPts.length ? '<div class="chartbox"><canvas id="ch-peso" role="img" aria-label="Andamento nel periodo"></canvas></div>' : vuoto('Nessun dato per questo esercizio nel periodo.')}
    </div>
    <div class="card" style="gap:12px">
      <div class="between" style="align-items:flex-end">
        <div class="head"><span class="eyebrow" style="letter-spacing:.5px">Volume totale</span><span style="font-size:12px;color:var(--mut)">kg × ripetizioni × serie, solo esercizi con pesi</span></div>
        <span class="num" style="font-size:26px;white-space:nowrap">${fmtInt(volTot)} kg</span>
      </div>
      <div class="seg small" style="grid-template-columns:repeat(3,minmax(0,1fr))">${segG}</div>
      ${vol.length ? '<div class="chartbox"><canvas id="ch-vol" role="img" aria-label="Volume totale"></canvas></div>' : vuoto('Nessun esercizio con pesi nel periodo.')}
    </div>
    <div class="card" style="gap:12px">
      <div class="head"><span class="eyebrow" style="letter-spacing:.5px">RIR percepito</span><span style="font-size:12px;color:var(--mut)">${esc(nomeEs)}</span></div>
      <div class="legend"><span><span style="width:18px;height:3px;background:var(--acc);border-radius:2px"></span>Percepito</span>${target != null ? `<span><span style="width:18px;border-top:2px dashed var(--mut)"></span>Target (RIR ${esc(rirT)})</span>` : ''}</div>
      ${rirPts.length ? '<div class="chartbox"><canvas id="ch-rir" role="img" aria-label="RIR percepito nel periodo"></canvas></div>' : vuoto('Nessun RIR registrato per questo esercizio nel periodo.')}
    </div>`}
  </div>`;
};

const etichetteBarre = {

function graficoLinea(id, punti, unita, opz = {}) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  const n = punti.length, last = n - 1;
  const ds = [{
    data: punti.map(p => p.y), borderColor: '#B93D0B', borderWidth: 3, tension: 0,
    pointRadius: punti.map((_, i) => i === last ? 5.5 : 4.5), pointBackgroundColor: punti.map((_, i) => i === last ? '#B93D0B' : '#FFFFFF'),
    pointBorderColor: '#B93D0B', pointBorderWidth: 2.5, pointHoverRadius: 7
  }];
  if (opz.target != null) ds.push({ data: punti.map(() => opz.target), borderColor: '#5A5F69', borderWidth: 1.5, borderDash: [5, 5], pointRadius: 0, pointHoverRadius: 0 });
  S.grafici.push(new Chart(el, {
    type: 'line', data: { labels: punti.map(p => p.x), datasets: ds },
    options: {
      maintainAspectRatio: false, animation: false, layout: { padding: { top: 8, right: 8 } },
      plugins: { legend: { display: false }, tooltip: { filter: it => it.datasetIndex === 0, displayColors: false, callbacks: { label: c => `${fmtN(c.parsed.y)} ${unita}` } } },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
        y: { grid: { color: '#EEEDE8' }, border: { display: false }, ticks: { maxTicksLimit: 5, stepSize: opz.step, callback: v => fmtN(v) }, min: opz.min, max: opz.max, grace: opz.min == null ? '10%' : 0 }
      }
    }
  }));
}

CH.fileBackup = async el => {
  const f = el.files[0]; el.value = '';
  if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); }
  catch { avviso('File non valido', '<div class="err">Il file scelto non è un JSON valido. Scegli un file creato con «Esporta backup».</div>'); return; }
  if (d?.tipo !== TIPO_BACKUP || !d.stato) {
    const msg = Array.isArray(d?.giorni) ? 'Questo file è una scheda, non un backup: usa «Importa nuova scheda».' : 'Questo file non è un backup dell\'app. Scegli un file creato con «Esporta backup».';
    avviso('File non valido', `<div class="err">${msg}</div>`); return;
  }
  const v = validaScheda(d.stato.scheda);
  if (v.errori) { avviso('Backup danneggiato', `<p class="txt">La scheda contenuta nel backup non è valida.</p>${erroriHtml(v.errori)}`); return; }
  const sessioni = (Array.isArray(d.sessioni) ? d.sessioni : []).filter(s => s && s.id && s.data && Array.isArray(s.esercizi));
  const note = d.note && typeof d.note === 'object' ? d.note : {};
  const quando = d.esportatoIl ? new Date(d.esportatoIl).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }) : 'data sconosciuta';
  if (!await conferma({ titolo: 'Ripristinare il backup?', testo: `Backup del ${quando}: ${sessioni.length === 1 ? '1 allenamento' : sessioni.length + ' allenamenti'}, ${Object.keys(note).length === 1 ? '1 nota' : Object.keys(note).length + ' note'}. Sostituisce TUTTI i dati attuali (scheda, settimana, storico e note).`, ok: 'Ripristina backup', pericolo: true })) return;
  const stato = completaStato({ ...d.stato, scheda: v.scheda });
  try {
    clearTimeout(salvaT); salvaT = null;
    toast('Ripristino in corso…');
    await S.archivio.sostituisciTutto({ stato, sessioni, note });
  } catch (e) { console.error(e); avviso('Ripristino non riuscito', '<div class="err">Controlla la connessione e riprova.</div>'); return; }
  S.stato = stato; S.sessioni = sessioni; S.note = note; S.giornoScelto = null;
  vai('home'); toast('Backup ripristinato');
};

A.controllaScheda = () => {
  const t = S.importaTesto.trim();
  if (!t) { S.importa = { errori: ['Scegli un file oppure incolla il testo della scheda.'] }; }
  else {
    let d;
    try { d = JSON.parse(t); }
    catch (e) {
      const pos = /position (\d+)/.exec(e.message);
      let dove = '';
      if (pos) { const p = Number(pos[1]); const prima = t.slice(0, p).split('\n'); dove = ` Il problema è alla riga ${prima.length}, colonna ${prima.at(-1).length + 1}.`; }
      S.importa = { errori: [`Il testo non è un JSON valido.${dove} Controlla virgole, parentesi e virgolette (spesso manca una virgola o ce n'è una di troppo prima di } o ]).`] };
      return renderImporta();
    }
    S.importa = validaScheda(d);

  const sc = S.stato.scheda, n = Number(el.value);
  if (!Number.isInteger(n) || n < 1 || n > 52) { toast('Scrivi un numero da 1 a 52'); el.value = sc.settimane; return; }
  if (n === sc.settimane) return;
  if (n < sc.settimane && !await conferma({ titolo: `Ridurre a ${n} settimane?`, testo: `Serie e ripetizioni delle settimane dalla ${n + 1} alla ${sc.settimane} verranno eliminate da tutti gli esercizi.`, ok: 'Riduci', pericolo: true })) { el.value = sc.settimane; return; }
  sc.giorni.forEach(g => g.esercizi.forEach(e => {
    while (e.settimane.length < n) { const u = clone(e.settimane.at(-1)); delete u.nota; e.settimane.push(u); }
    e.settimane.length = n;
  }));
  const prima = sc.settimane;
  sc.settimane = n;
  S.stato.settimana = Math.min(S.stato.settimana, n);
  salva(); render(); toast(n > prima ?'Settimane aggiunte: controlla serie e ripetizioni' : `La scheda ora ha ${n} settimane`);

async function caricaDati() {
  try {
    const d = await S.archivio.carica();
    S.sessioni = d.sessioni || []; S.note = d.note || {};
    S.stato = d.stato ? completaStato(d.stato) : null;
    if (!S.stato) { S.stato = statoIniziale(); await S.archivio.salvaStato(S.stato); }
  } catch (e) {
    console.error(e);
    S.stato = null;
    if (e?.code === 'permission-denied') vistaErrore('Account non autorizzato', `L'account <b>${esc(S.utente?.email || '')}</b> non può usare questa app. Accedi con il tuo account Google.`, true);
    else vistaErrore('Impossibile caricare i dati', 'Controlla la connessione e riprova.', false);
    return;
  }
  render();
  const r = rotta().nome;
  const s = sess();
  if (s && r !== 'giorno' && r !== 'esercizio') {
    const di = new Date(s.inizio);
    const quando = (di.toDateString() === new Date().toDateString() ? 'oggi' : di.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })) + ' alle ' + di.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    if (await conferma({ titolo: 'Allenamento in corso', testo: `Hai un allenamento non concluso: ${s.nomeGiorno}, iniziato ${quando}. Vuoi riprenderlo?`, ok: 'Riprendi allenamento', annulla: 'Più tardi' })) vai('giorno');
  }
}

async function avvio() {
  if (!FIREBASE_CONFIG.apiKey) { S.archivio = creaArchivioLocale(); await caricaDati(); return; }
  try {
    const [app, auth, fs] = await Promise.all([import(FB_URL + 'firebase-app.js'), import(FB_URL + 'firebase-auth.js'), import(FB_URL + 'firebase-firestore.js')]);
