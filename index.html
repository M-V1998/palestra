<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<title>Palestra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B93D0B'/%3E%3Cpath d='M14 32h36M20 22v20M44 22v20M14 26v12M50 26v12' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F4F0;--card:#FFFFFF;--line:#E4E2DC;--ink:#17191E;--mut:#5A5F69;--mut2:#3F444D;
  --acc:#B93D0B;--acc-h:#8F2E07;--acc-soft:#FBEBE2;--ok:#2E7D4F;--ok-ink:#1F6B40;--ok-soft:#E5F2EA;
  --t-acc:#F08A5D;--in:#C9C6BE;--chip:#EEEDE8;--seg:#E9E7E1;--thumb:#2A2D34;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
a{color:var(--acc)} a:hover{color:var(--acc-h)}
button{appearance:none;-webkit-appearance:none;background:none;border:0;margin:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid rgba(185,61,11,.45);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}

.scr{padding:28px 20px calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.scr.sub{padding:20px 20px calc(32px + env(safe-area-inset-bottom));gap:14px}
.scr.sub.nav{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.scr.center{min-height:100vh;min-height:100dvh;justify-content:center;padding-bottom:28px}
.head{display:flex;flex-direction:column;gap:2px}
.date{font-size:13px;color:var(--mut);font-weight:600}
h1.big{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.sm{border-radius:14px;padding:12px 14px;gap:4px}
.eyebrow{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.grp{margin:6px 0 0;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.muted{color:var(--mut)}
.txt{margin:0;font-size:15px;line-height:1.45;color:var(--mut2)}
.hint{margin:0;font-size:13px;color:var(--mut);font-weight:600}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.banner{background:var(--chip);color:var(--mut2);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.4}

/* settimana e giorni */
.weekbar{display:grid;gap:6px}
.weekbar span{height:6px;border-radius:3px;background:var(--line)}
.weekbar .past{background:var(--ink)} .weekbar .cur{background:var(--acc)}
.days{display:grid;gap:10px}
.day{background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px}
.day .l{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--mut);line-height:1.1}
.day .s{font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:4px}
.day.done{background:var(--ok-soft)} .day.done .l,.day.done .s{color:var(--ok-ink);font-weight:700}
.day.sel{background:#fff;border-color:var(--acc)} .day.sel .l,.day.sel .s{color:var(--acc);font-weight:700}
.day.done.sel{background:var(--ok-soft)} .day.done.sel .l,.day.done.sel .s{color:var(--ok-ink)}
.tag-scarico{align-self:flex-start;background:var(--acc-soft);color:var(--acc);font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px}

/* pulsanti */
.cta{background:var(--acc);color:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:64px}
.cta .t{display:block;font-size:19px;font-weight:800}
.cta .st{display:block;font-size:13px;font-weight:500;color:#FBE3D6;margin-top:2px}
.link-row{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer}
.link-row:hover{color:var(--ink)}
.link-row .tx{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.link-row .t{font-size:16px;font-weight:700}
.link-row .st{font-size:13px;color:var(--mut)}
.ic{width:44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic.neutral{background:var(--chip);color:var(--mut2)}
.btn-out{border:2px solid var(--ink);border-radius:14px;padding:12px;text-align:center;font-size:15px;font-weight:700;width:100%;min-height:48px}
.btn-txt{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--mut);text-decoration:underline;padding:8px;min-height:40px;width:100%}
.btn-pri{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:16px;padding:15px;text-align:center;font-size:16px;font-weight:800;width:100%;min-height:52px}
.btn-dark{background:var(--ink);color:#fff;border-radius:18px;padding:18px;text-align:center;font-size:17px;font-weight:800;width:100%;min-height:56px}
.btn-sec{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:15px;font-weight:700;width:100%;min-height:48px;cursor:pointer}
.btn-danger{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid #E7C2B1;color:#A3320A;border-radius:14px;padding:12px;font-size:15px;font-weight:700;width:100%;min-height:48px}
.btn-danger.full{background:#A3320A;color:#fff;border-color:#A3320A;border-radius:16px;min-height:52px;font-weight:800}
.btn-dash{border:2px dashed var(--in);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--mut2);width:100%;min-height:52px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);text-decoration:none}
.iconbtn.plain{background:none;border:0;color:var(--mut)}
.pill-btn{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;flex-shrink:0}

/* barra in alto delle schermate interne */
.topbar{display:flex;align-items:center;gap:8px}
.topbar .tt{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.topbar h1{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.topbar .sub{font-size:13px;color:var(--mut);font-weight:600}
.topbar .lbl-top{font-size:13px;color:var(--mut);font-weight:700;flex-grow:1;min-width:0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress div{height:6px;background:var(--ok)}

/* card esercizio */
.ex{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.ex.cur{border:2px solid var(--acc);padding:11px}
.ex.done{opacity:.85}
.ex.skip{opacity:.6}
.ex .body{display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0;text-align:left;align-self:stretch;justify-content:center}
.ex .n{font-size:15px;font-weight:700}
.ex .m{font-size:13px;color:var(--mut);font-weight:600}
.ex .tn{font-size:12.5px;color:var(--mut);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ex .tn b{color:var(--mut2)}
.ex .vlink{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;text-decoration:none;align-self:flex-start;padding:4px 0}
.ord{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.ord button{width:36px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.thumb{width:84px;height:64px;border-radius:10px;background:var(--thumb);flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img,.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pl{position:relative;width:30px;height:30px;border-radius:15px;background:rgba(23,25,30,.55);display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--chip);color:var(--mut2)}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)} .chip.acc{background:var(--acc-soft);color:var(--acc)}

/* esercizio in corso */
.video{border-radius:16px;background:var(--thumb);height:190px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#D6D8DD;text-decoration:none}
.video .pl{position:relative;width:60px;height:60px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.vlink-big{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;text-decoration:none;margin-top:-4px;min-height:32px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.stat .x{font-size:11px;color:var(--mut);font-weight:600}
.k-up{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}

.timer{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:background-color .3s}
.timer .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.timer .dots i{width:10px;height:10px;border-radius:5px;background:#4A4E57}
.timer .dots i.f{background:#fff} .timer .dots i.c{background:var(--t-acc)}
.timer .undo{font-size:12px;font-weight:700;color:#B5B8BF;text-decoration:underline;padding:6px 4px}
.tbtn{width:48px;height:48px;border-radius:24px;border:1px solid #4A4E57;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#D6D8DD;flex-shrink:0}
.tmid{display:flex;flex-direction:column;align-items:center;text-align:center}
.tnum{font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tsub{font-size:12px;color:#B5B8BF;font-weight:600}
.tbar{height:6px;border-radius:3px;background:#33363E;overflow:hidden}
.tbar div{height:6px;background:var(--t-acc)}
.tg1{border:1px solid #4A4E57;border-radius:14px;padding:13px;text-align:center;font-size:14px;font-weight:700;min-height:48px}
.tg2{background:#fff;color:var(--ink);border-radius:14px;padding:13px;text-align:center;font-size:14px;font-weight:800;min-height:48px}
.timer.end{background:var(--ok);animation:fine 1.1s ease-out 3}
.timer.end .tsub{color:#fff;font-size:15px;font-weight:800}
.timer.end .tbtn,.timer.end .tg1{border-color:rgba(255,255,255,.5);color:#fff}
.timer.end .tbar{background:rgba(255,255,255,.3)} .timer.end .tbar div{background:#fff}
.timer.end .dots i{background:rgba(255,255,255,.35)} .timer.end .dots i.f{background:#fff} .timer.end .dots i.c{background:#BFE3CC}
.timer.end .undo{color:#E5F2EA}
@keyframes fine{0%{box-shadow:0 0 0 0 rgba(46,125,79,.75)}100%{box-shadow:0 0 0 20px rgba(46,125,79,0)}}
@media (prefers-reduced-motion:reduce){.timer.end{animation:none}}

/* form */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:700;color:var(--mut)}
.inp{width:100%;height:48px;border:1px solid var(--in);border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.inp.big{height:52px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;padding:0 6px}
textarea.inp{height:auto;padding:12px;resize:vertical;line-height:1.4;min-height:72px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:160px}
select.inp{font-weight:700;font-size:15px;padding-right:8px}
.static{height:52px;border-radius:12px;background:var(--chip);color:var(--mut2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-align:center;padding:0 6px}
.rir{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rir button{height:44px;border-radius:12px;border:1px solid var(--in);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.rir button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.err{background:var(--acc-soft);color:var(--acc-h);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45}
.err ul{margin:6px 0 0;padding-left:18px}
.ok-box{background:var(--ok-soft);color:var(--ok-ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45}
.wrow{display:grid;grid-template-columns:52px 1fr 14px 1fr 1.3fr;gap:6px;align-items:center}
.wrow .inp{height:44px;padding:0 8px;text-align:center}
.wrow .inp.nota{text-align:left;font-size:14px}
.wrow span{font-size:13px;font-weight:700;color:var(--mut);text-align:center}
.saved{font-size:12px;color:var(--mut);font-weight:600;min-height:16px}

/* segmented */
.seg{background:var(--seg);border-radius:14px;padding:4px;display:grid;gap:4px}
.seg button{height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mut2);min-width:0;padding:0 4px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:800}
.seg.small button{height:34px;font-size:13px}
.pnav{display:flex;align-items:center;gap:8px}
.pnav .lab{flex-grow:1;text-align:center;font-size:15px;font-weight:800}
.chartbox{position:relative;height:190px}
.empty{font-size:14px;color:var(--mut);font-weight:600;text-align:center;padding:28px 8px;background:var(--bg);border-radius:14px}
.legend{display:flex;gap:16px;font-size:12px;font-weight:600;color:var(--mut2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}

/* progressi */
.ex .m b.kg{color:var(--ink);font-weight:800;white-space:nowrap}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:11px;font-weight:700;color:var(--mut)}
.tile .v{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.tile .v small{font-size:17px;color:var(--mut)}
.dtabs{display:grid;gap:8px}
.dtabs button{height:44px;border-radius:12px;border:1px solid var(--in);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;min-width:0;padding:0 4px;text-align:center}
.dtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:800}
.pcard{padding:14px;gap:10px;border-radius:18px}
.pmeta{font-size:12px;color:var(--mut);font-weight:600}
.pgrid{display:grid;gap:4px}
.pscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.pscroll .pgrid{width:max-content}
.pc{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
.pc.cur{border:2px solid var(--acc);padding:5px 1px}
.pc.vuota{background:var(--bg);border-color:transparent}
.pc.vuota.cur{border-color:var(--acc)}
.pc .pl{font-size:10px;font-weight:800;color:var(--mut);white-space:nowrap}
.pc .pv{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pc.vuota .pv{color:#9A9DA4}
.pc .ps{font-size:11px;font-weight:600;white-space:nowrap}
.pc.vuota .ps{color:var(--mut)}
.pc .ps.diff{color:var(--acc);font-weight:800}
.pc .ps.sk{color:var(--acc-h);font-weight:700;font-size:10px}
.pc .pr{font-size:10px;color:var(--mut);font-weight:600;white-space:nowrap}
.pone{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--mut2)}
.pone .pv{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--ink)}
.plink{font-size:13px;font-weight:700;text-decoration:none;align-self:flex-start;padding:4px 0}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .hd{font-size:14px;font-weight:700;display:flex;flex-direction:column}
.hrow .hd small{font-size:12px;color:var(--mut);font-weight:600}
.hrow .hv{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-align:right}
.hrow .hs{grid-column:1/-1;font-size:13px;color:var(--mut2)}
/* editor settimane */
.wcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wcard .wt{font-size:13px;font-weight:800}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wgrid .inp{height:44px;padding:0 6px;text-align:center}
.wcard .inp.nota{height:40px;font-size:14px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:480px;margin:0 auto;height:76px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11px;font-weight:600;text-decoration:none}
#nav a[aria-current="page"]{color:var(--acc);font-weight:700}

/* fogli e messaggi */
.ov{position:fixed;inset:0;background:rgba(23,25,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sh h2{margin:0;font-size:20px;font-weight:800}
@media (min-width:560px){.ov{align-items:center;padding:20px}.sh{border-radius:22px}}

// ---------- utilità ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmtInt = n => migliaia(String(Math.round(n)));

const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const fmtRec = sec => { if (!sec) return ''; const m = Math.floor(sec / 60), s = sec % 60; return (m ? m + "'" : '') + (s ? s + "''" : ''); };
const dataBreve = d => d.getDate() + ' ' + d.toLocaleDateString('it-IT', { month: 'short' }).replace('.', '');
const oggiISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

const IC = {
  check: '<path d="M5 12l5 5L19 7"/>', arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  chevR: '<path d="M9 6l6 6-6 6"/>', chevL: '<path d="M15 6l-6 6 6 6"/>',

  ext: '<path d="M14 4h6v6M20 4l-10 10M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',

const play = (s, col) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="${col}"/></svg>`;

function ytId(url) {
  const m = str(url).match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function miniatura(url) {
  const id = ytId(url);
  const img = id ? `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : '';

  return url ? `<a class="thumb" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Apri il video su YouTube">${inner}</a>` : `<div class="thumb">${inner}</div>`;
}

let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

// ---------- validazione della scheda ----------
function validaScheda(d) {
  const err = [];
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { errori: ['Il file non contiene una scheda: mi aspettavo un oggetto JSON con "settimane" e "giorni".'] };
  const nS = Number(d.settimane);
  if (!Number.isInteger(nS) || nS < 1 || nS > 52) err.push('"settimane" (in cima al file) deve essere un numero intero da 1 a 52.');
  const out = { schemaVersion: 2, nome: str(d.nome) || 'Scheda', obiettivo: str(d.obiettivo), settimane: nS, riscaldamento: [], giorni: [] };
  // identificativo della scheda (serve a non mescolare lo storico di schede diverse)
  if (str(d.id)) out.id = str(d.id);
  if (d.legacy === true) out.legacy = true;
  if (d.riscaldamento != null) {
    if (!Array.isArray(d.riscaldamento)) err.push('"riscaldamento" deve essere un elenco di sezioni.');
    else d.riscaldamento.forEach((s, i) => {
      const dove = `Riscaldamento, sezione ${i + 1}`;
      if (!s || typeof s !== 'object') { err.push(`${dove}: non è valida.`); return; }
      const sez = { sezione: str(s.sezione) || `Sezione ${i + 1}`, esercizi: [] };
      if (!Array.isArray(s.esercizi)) err.push(`${dove} (${sez.sezione}): manca l'elenco "esercizi".`);
      else s.esercizi.forEach((e, j) => {
        if (!e || !str(e.nome)) { err.push(`${dove} (${sez.sezione}), esercizio ${j + 1}: manca il "nome".`); return; }
        sez.esercizi.push({ nome: str(e.nome), prescrizione: str(e.prescrizione), videoUrl: str(e.videoUrl) });
      });
      out.riscaldamento.push(sez);
    });
  }
  if (!Array.isArray(d.giorni) || !d.giorni.length) err.push('"giorni" deve essere un elenco con almeno un giorno (es. A, B, C).');
  else {
    const ids = new Set();
    d.giorni.forEach((g, i) => {
      const id = str(g?.id);
      const dove = `Giorno ${id || i + 1}`;
      if (!id) err.push(`Giorno ${i + 1}: manca l'"id" (es. "A").`);
      else if (ids.has(id)) err.push(`${dove}: l'id "${id}" compare due volte.`);
      ids.add(id);
      const gg = { id: id || String(i + 1), nome: str(g?.nome) || `Giorno ${id || i + 1}`, esercizi: [] };
      if (!Array.isArray(g?.esercizi) || !g.esercizi.length) err.push(`${dove}: deve avere almeno un esercizio in "esercizi".`);
      else g.esercizi.forEach((e, j) => {
        const r = validaEsercizio(e, nS, `${dove}, esercizio ${j + 1}${str(e?.nome) ? ` (${str(e.nome)})` : ''}`, err);
        if (r) gg.esercizi.push(r);
      });
      out.giorni.push(gg);
    });
  }
  return err.length ? { errori: err } : { scheda: out };
}
function validaEsercizio(e, nS, dove, err) {
  if (!e || typeof e !== 'object') { err.push(`${dove}: non è valido.`); return null; }
  const n0 = err.length;
  const nome = str(e.nome);
  if (!nome) err.push(`${dove}: manca il "nome".`);
  const tipo = e.tipoCarico == null || e.tipoCarico === '' ? 'kg' : e.tipoCarico;
  if (!TIPI[tipo]) err.push(`${dove}: "tipoCarico" deve essere "kg", "corpo_libero" oppure "elastico" (c'è scritto "${tipo}").`);
  if (e.perLato != null && typeof e.perLato !== 'boolean') err.push(`${dove}: "perLato" deve essere true oppure false.`);
  const sett = [];
  if (!Array.isArray(e.settimane)) err.push(`${dove}: manca l'elenco "settimane".`);
  else {
    if (Number.isInteger(nS) && e.settimane.length !== nS) err.push(`${dove}: "settimane" deve avere ${nS} elementi, uno per settimana (ne ha ${e.settimane.length}).`);
    e.settimane.forEach((w, k) => {
      const se = Number(w?.serie), ri = Number(w?.ripetizioni);
      if (!Number.isInteger(se) || se < 1) err.push(`${dove}, settimana ${k + 1}: "serie" deve essere un numero intero maggiore di 0.`);
      if (!Number.isInteger(ri) || ri < 1) err.push(`${dove}, settimana ${k + 1}: "ripetizioni" deve essere un numero intero maggiore di 0.`);
      const o = { serie: se, ripetizioni: ri };
      if (str(w?.nota)) o.nota = str(w.nota);
      // recupero e RIR della singola settimana (facoltativi: se mancano valgono quelli dell'esercizio)
      if (w?.recuperoSec != null && w.recuperoSec !== '') {
        const r = Number(w.recuperoSec);
        if (!Number.isInteger(r) || r < 0) err.push(`${dove}, settimana ${k + 1}: "recuperoSec" deve essere un numero intero di secondi.`);
        else o.recuperoSec = r;
      }
      if (str(w?.rir)) o.rir = str(w.rir);
      sett.push(o);
    });
  }
  const rec = e.recuperoSec == null || e.recuperoSec === '' ? 0 : Number(e.recuperoSec);
  if (!Number.isInteger(rec) || rec < 0) err.push(`${dove}: "recuperoSec" deve essere un numero intero di secondi (0 se non indicato).`);
  if (err.length > n0) return null;
  const rir = str(e.rir);
  // i valori della settimana uguali a quelli dell'esercizio non servono: così cambiando il valore generale cambiano tutte le settimane
  sett.forEach(o => { if (o.recuperoSec === rec) delete o.recuperoSec; if (o.rir != null && o.rir === rir) delete o.rir; });
  return { nome, categoria: str(e.categoria) || 'Altro', tipoCarico: tipo, perLato: !!e.perLato, settimane: sett, rir, tempo: str(e.tempo), recuperoSec: rec, note: str(e.note), videoUrl: str(e.videoUrl) };
}

  const max = 15, extra = errori.length - max;
  return `<div class="err">Ho trovato ${errori.length === 1 ? 'un problema' : errori.length + ' problemi'}:<ul>${errori.slice(0, max).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${extra > 0 ? `<div>…e altri ${extra}.</div>` : ''}</div>`;
}

const pulisci = o => JSON.parse(JSON.stringify(o));

function creaArchivioLocale() {
  const K = 'palestra-prova-v1';
  const leggi = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch { return {}; } };
  const scrivi = d => { try { localStorage.setItem(K, JSON.stringify(d)); } catch { toast('Il browser non riesce a salvare i dati di prova'); } };
  return {
    locale: true,
    async carica() { const d = leggi(); return { stato: d.stato || null, sessioni: d.sessioni || [], note: d.note || {} }; },
    async salvaStato(s) { const d = leggi(); d.stato = pulisci(s); scrivi(d); },
    async salvaSessione(s) { const d = leggi(); d.sessioni = (d.sessioni || []).filter(x => x.id !== s.id); d.sessioni.push(pulisci(s)); scrivi(d); },
    async salvaNota(k, v) { const d = leggi(); d.note = d.note || {}; if (v) d.note[k] = v; else delete d.note[k]; scrivi(d); },
    async sostituisciTutto(b) { scrivi(pulisci(b)); },
    async cancellaTutto() { try { localStorage.removeItem(K); } catch { } }
  };
}

let FBX = null;
function creaArchivioFirebase(utente) {
  const { doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch } = FBX.F;
  const db = FBX.db;
  const docStato = doc(db, 'utenti', utente.uid, 'dati', 'stato');
  const colSess = collection(db, 'utenti', utente.uid, 'sessioni');
  const colNote = collection(db, 'utenti', utente.uid, 'noteEsercizi');
  const idNota = k => encodeURIComponent(k).slice(0, 1400) || 'vuoto';
  return {
    locale: false,
    async carica() {
      const [s, ss, nn] = await Promise.all([getDoc(docStato), getDocs(colSess), getDocs(colNote)]);
      const note = {};
      nn.forEach(d => { const v = d.data(); if (v?.nome) note[norm(v.nome)] = v; });
      return { stato: s.exists() ? s.data() : null, sessioni: ss.docs.map(d => d.data()), note };
    },
    salvaStato: s => setDoc(docStato, pulisci(s)),
    salvaSessione: s => setDoc(doc(colSess, s.id), pulisci(s)),
    salvaNota: (k, v) => v ? setDoc(doc(colNote, idNota(k)), pulisci(v)) : deleteDoc(doc(colNote, idNota(k))),
    async sostituisciTutto(b) {
      const [ss, nn] = await Promise.all([getDocs(colSess), getDocs(colNote)]);
      const ops = [];
      ss.forEach(d => ops.push(bt => bt.delete(d.ref)));
      nn.forEach(d => ops.push(bt => bt.delete(d.ref)));
      b.sessioni.forEach(s => ops.push(bt => bt.set(doc(colSess, s.id), pulisci(s))));
      Object.entries(b.note).forEach(([k, v]) => ops.push(bt => bt.set(doc(colNote, idNota(k)), pulisci(v))));
      for (let i = 0; i < ops.length; i += 400) {
        const bt = writeBatch(db);
        ops.slice(i, i + 400).forEach(f => f(bt));
        await bt.commit();
      }
      await setDoc(docStato, pulisci(b.stato));
    }
  };
}

// peso da proporre: quello usato l'ultima volta su questo esercizio
function pesoProposto(e) {
  if (e.tipoCarico === 'corpo_libero') return null;
  return ultimoRisultato(e.nome, true)?.peso ?? null;
}
function pesoTesto(e, r) {
  if (e.tipoCarico === 'corpo_libero') return 'corpo libero';
  if (r.peso == null) return '';
  return (e.tipoCarico === 'elastico' ? 'elastico ' : '') + fmtN(r.peso) + ' kg';
}
VISTE.giorno = () => {
  const s = sess(), list = s.esercizi, tot = list.length;
  const fatti = list.filter(e => e.stato === 'fatto').length;
  const cur = correnteUid();
  let cat = null, h = '';
  list.forEach(e => {
    if (e.categoria !== cat) { cat = e.categoria; h += `<h2 class="grp">${esc(cat)}</h2>`; }
    const isCur = e.uid === cur, done = e.stato === 'fatto', skip = e.stato === 'saltato';
    const chips = [];
    if (done) { const pt = pesoTesto(e, e.risultato); chips.push(`<span class="chip ok">${ico('check', 13, 3)}Fatto${pt ? ' · ' + esc(pt) : ''}</span>`); }
    else if (skip) chips.push('<span class="chip">Saltato</span>');
    else if (isCur) chips.push('<span class="chip acc">In corso</span>');
    if (e.notaSett) chips.push(`<span class="chip acc">${esc(cap(e.notaSett))}</span>`);
    if (e.tipoCarico !== 'kg') chips.push(`<span class="chip">${TIPI[e.tipoCarico]}</span>`);
    if (e.aggiunto) chips.push('<span class="chip">Aggiunto oggi</span>');
    if (e.nomeOriginale) chips.push(`<span class="chip">Al posto di ${esc(e.nomeOriginale)}</span>`);
    const mia = S.note[norm(e.nome)]?.testo;
    const pp = !done ? pesoProposto(e) : null;
    const pesoMeta = pp != null ? ` · <b class="kg">${e.tipoCarico === 'elastico' ? 'elastico ' : ''}${fmtN(pp)} kg</b>` : '';
    h += `<div class="ex${isCur ? ' cur' : ''}${done ? ' done' : ''}${skip ? ' skip' : ''}">
      ${miniatura(e.videoUrl)}
      <button class="body" data-a="apriEs" data-u="${e.uid}">
        <span class="n">${esc(e.nome)}</span><span class="m">${esc(metaEs(e))}${pesoMeta}</span>
        ${e.note ? `<span class="tn">${esc(e.note)}</span>` : ''}
        ${mia ? `<span class="tn"><b>Mia nota:</b> ${esc(mia)}</span>` : ''}
        ${chips.length ? `<span class="chips">${chips.join('')}</span>` : ''}
      </button>
      ${!done && !isCur ? `<button class="iconbtn plain" aria-label="Modifica per oggi" data-a="modOggi" data-u="${e.uid}">${ico('pencil', 20)}</button>` : ''}
    </div>`;
  });
  const finito = !list.some(e => e.stato === 'da_fare');
  return `<div class="scr sub">
    <div class="topbar">
      <a class="iconbtn" href="#home" aria-label="Indietro">${ico('chevL')}</a>
      <div class="tt"><h1>${esc(s.nomeGiorno)}</h1><span class="sub">Settimana ${s.settimana} · ${tot} esercizi</span></div>
      <span class="num" style="font-size:22px">${fatti}<span style="color:var(--mut)">/${tot}</span></span>
    </div>
    <div class="progress"><div style="width:${tot ? Math.round(fatti / tot * 100) : 0}%"></div></div>
    ${h || '<div class="empty">Nessun esercizio per oggi.</div>'}
    <button class="btn-dash" data-a="modOggi">${ico('plus', 18, 2.5)}Aggiungi esercizio per oggi</button>
    ${finito && tot ? '<div class="ok-box">Hai registrato tutti gli esercizi. Premi «Fine allenamento» per salvare.</div>' : ''}
    <button class="btn-dark" style="margin-top:6px" data-a="fineAllenamento">Fine allenamento</button>
    <button class="btn-txt" data-a="annullaAllenamento">Annulla allenamento senza salvare</button>
  </div>`;
};
A.apriEs = el => vai('esercizio/' + el.dataset.u);
A.annullaAllenamento = async () => {
  const ok = await conferma({ titolo: 'Annullare l\'allenamento?', testo: 'L\'allenamento in corso verrà eliminato senza salvare i dati inseriti. Le tue note sugli esercizi restano.', ok: 'Annulla allenamento', annulla: 'No, continua', pericolo: true });
  if (!ok) return;
  S.stato.sessioneInCorso = null;
  await scriviStato();
  vai('home'); toast('Allenamento annullato');
};
A.fineAllenamento = async () => {
  const s = sess();
  const fatti = s.esercizi.filter(e => e.stato === 'fatto');
  const nonFatti = s.esercizi.filter(e => e.stato !== 'fatto');
  if (!fatti.length) {
    if (!await conferma({ titolo: 'Nessun esercizio registrato', testo: 'Non hai registrato nessun esercizio. Vuoi chiudere comunque l\'allenamento e segnare il giorno come completato?', ok: 'Chiudi allenamento' })) return;
  } else if (nonFatti.length) {
    if (!await conferma({ titolo: 'Fine allenamento', testo: `${nonFatti.length === 1 ? '1 esercizio non registrato verrà salvato' : nonFatti.length + ' esercizi non registrati verranno salvati'} come ${nonFatti.length === 1 ? 'saltato' : 'saltati'}:${nonFatti.map(e => e.nome).join(', ')}.`, ok: 'Salva allenamento' })) return;
  }
  const rec = {
    id: s.id, data: new Date().toISOString(), inizio: s.inizio, giorno: s.giorno, nomeGiorno: s.nomeGiorno, settimana: s.settimana,
    scheda: S.stato.scheda.nome, schedaId: S.stato.scheda.id, ciclo: S.stato.ciclo || 1,
    esercizi: fatti.map(e => ({
      nome: e.nome, nomeOriginale: e.nomeOriginale || null, categoria: e.categoria, tipoCarico: e.tipoCarico, perLato: !!e.perLato,
      previsto: { serie: e.serie, ripetizioni: e.ripetizioni, rir: e.rir || '' },
      peso: e.tipoCarico === 'corpo_libero' ? null : e.risultato.peso, serie: e.risultato.serie, ripetizioni: e.risultato.ripetizioni,
      rirPercepito: e.risultato.rir
    })),
    saltati: nonFatti.map(e => e.nome)
  };
  try { await S.archivio.salvaSessione(rec); }
  catch (e) { console.error(e); toast('Non riesco a salvare: controlla la connessione e riprova'); return; }
  S.sessioni.push(rec);
  S.stato.ultimoGiorno = s.giorno;
  if (!S.stato.completati.includes(s.giorno)) S.stato.completati.push(s.giorno);
  S.stato.sessioneInCorso = null; S.giornoScelto = null;
  await scriviStato();
  vai('home'); toast('Allenamento salvato');
  // ultimo giorno dell'ultima settimana: proponi il report per il PT
  const st = S.stato, sc = st.scheda;
  if (st.settimana >= sc.settimane && sc.giorni.every(g => st.completati.includes(g.id))) {
    const ok = await conferma({ titolo: 'Scheda completata!', testo: `Hai finito tutte le ${sc.settimane} settimane. Vuoi scaricare il report dei progressi da mandare al tuo personal trainer?`, ok: 'Scarica report per il PT', annulla: 'Più tardi' });
    if (ok) { S.prog.periodo = 'scheda'; S.prog.offset = 0; scaricaReport(); }
  }
};

    <div class="fld"><label for="o-nome">Nome esercizio</label><input class="inp" id="o-nome" value="${esc(e.nome)}" autocomplete="off">

}
A.modOggi = el => {

  const e = nuovo ? { nome: '', categoria: 'Monoarticolari', tipoCarico: 'kg', perLato: false, serie: 3, ripetizioni: 10, rir: '', tempo: '', recuperoSec: 60, note: '', videoUrl: '' } : esDaUid(uid);
  if (!e) return;

    ${nuovo ? '' : `<div class="grid2">
        <button class="btn-sec" data-a="spostaOggi" data-u="${uid}" data-d="-1">${ico('up', 18)}Sposta su</button>
        <button class="btn-sec" data-a="spostaOggi" data-u="${uid}" data-d="1">${ico('down', 18)}Sposta giù</button>
      </div>
      <div class="grid2">
        <button class="btn-sec" data-a="saltaOggi" data-u="${uid}">${salto ? 'Rimetti in lista' : 'Salta oggi'}</button>

      </div>`}
    <button class="btn-txt" data-a="chiudiFoglio">Annulla</button>`);
};
A.salvaOggi = el => {
  const uid = el.dataset.u, s = sess();
  const nome = str($('#o-nome').value).replace(/\s+/g, ' ');
  const serie = Number($('#o-serie').value), rip = Number($('#o-rip').value), rec = Number($('#o-rec').value || 0);
  const errori = [];
  if (!nome) errori.push('Scrivi il nome dell\'esercizio.');
  if (!Number.isInteger(serie) || serie < 1) errori.push('Le serie devono essere un numero intero maggiore di 0.');
  if (!Number.isInteger(rip) || rip < 1) errori.push('Le ripetizioni devono essere un numero intero maggiore di 0.');
  if (!Number.isInteger(rec) || rec < 0) errori.push('Il recupero va indicato in secondi (es. 90).');
  if (errori.length) { $('#o-err').innerHTML = erroriHtml(errori); return; }
  const dati = { serie, ripetizioni: rip, recuperoSec: rec, rir: str($('#o-rir').value), tipoCarico: $('#o-tipo').value, perLato: $('#o-lato').checked, note: str($('#o-note').value), videoUrl: str($('#o-video').value) };
  if (!uid) {
    const e = { ...daScheda({ nome, categoria: $('#o-cat').value, tipoCarico: dati.tipoCarico, perLato: dati.perLato, settimane: [{ serie, ripetizioni: rip }], rir: dati.rir, tempo: '', recuperoSec: rec, note: dati.note, videoUrl: dati.videoUrl }), aggiunto: true };
    s.esercizi.push(e);
    toast('Esercizio aggiunto per oggi');
  } else {
    const e = esDaUid(uid);
    if (norm(nome) !== norm(e.nome) && !e.aggiunto) {
      const orig = e.nomeOriginale || e.nome;
      e.nomeOriginale = norm(orig) === norm(nome) ? null : orig;
    }
    Object.assign(e, dati, { nome });
    e.durata = rec || e.durata || 90;
    e.serieFatte = Math.min(e.serieFatte, serie);
    toast('Modificato solo per oggi');
  }
  salva(); chiudiFoglio(); render();
};
A.spostaOggi = el => {
  const s = sess(), i = s.esercizi.findIndex(e => e.uid === el.dataset.u), j = i + Number(el.dataset.d);
  if (i < 0 || j < 0 || j >= s.esercizi.length) { toast('Non si può spostare oltre'); return; }
  [s.esercizi[i], s.esercizi[j]] = [s.esercizi[j], s.esercizi[i]];
  salva(); render();
  A.modOggi(el);
};
A.saltaOggi = el => {
  const e = esDaUid(el.dataset.u);
  e.stato = e.stato === 'saltato' ? 'da_fare' : 'saltato';
  salva(); chiudiFoglio();
  if (e.stato === 'saltato' && rotta().nome === 'esercizio') return vaiAlProssimo(e, 'Esercizio saltato');
  render(); toast(e.stato === 'saltato' ? 'Esercizio saltato' : 'Rimesso in lista');
};
A.eliminaOggi = async el => {
  const uid = el.dataset.u, e = esDaUid(uid);
  if (!await conferma({ titolo: 'Eliminare per oggi?', testo: `«${e.nome}» verrà tolto solo dall'allenamento di oggi. La scheda non cambia.`, ok: 'Elimina per oggi', pericolo: true })) return;
  const s = sess();
  s.esercizi = s.esercizi.filter(x => x.uid !== uid);
  salva();
  if (rotta().nome === 'esercizio') vai('giorno'); else render();
  toast('Esercizio tolto per oggi');
};

function valoriForm(e) {
  const r = e.bozza || (e.risultato ? { peso: e.risultato.peso == null ? '' : String(e.risultato.peso).replace('.', ','), serie: e.risultato.serie, ripetizioni: e.risultato.ripetizioni, rir: e.risultato.rir } : null);
  if (r) return r;
  const pp = pesoProposto(e);
  return { peso: pp == null ? '' : String(pp).replace('.', ','), serie: e.serie, ripetizioni: e.ripetizioni, rir: null, proposto: pp != null };
}
function formCompletato(e) {

    ? `<div class="fld"><span class="lbl">Carico</span><div class="static">Corpo libero</div></div>`

  return `<div class="card" style="padding:16px">
    <h2 style="margin:0;font-size:17px;font-weight:800">Esercizio completato</h2>
    <div class="grid3">
      ${campoPeso}
      <div class="fld"><label for="f-serie">Serie</label><input class="inp big" id="f-serie" inputmode="numeric" value="${esc(v.serie)}" data-in="bozza" data-u="${e.uid}" autocomplete="off"></div>
      <div class="fld"><label for="f-rip">Ripetizioni</label><input class="inp big" id="f-rip" inputmode="numeric" value="${esc(v.ripetizioni)}" data-in="bozza" data-u="${e.uid}" autocomplete="off"></div>
    </div>
    ${notaPeso}

  </div>`;
}
function leggiBozza(e) {
  return { peso: $('#f-peso') ? $('#f-peso').value : '', serie: $('#f-serie').value, ripetizioni: $('#f-rip').value, rir: e.bozza?.rir ?? valoriForm(e).rir ?? null };
}
IN.bozza = el => { const e = esDaUid(el.dataset.u); e.bozza = leggiBozza(e); salva(); };
A.rir = el => {
  const e = esDaUid(el.dataset.u), v = Number(el.dataset.v);
  const b = leggiBozza(e);
  b.rir = b.rir === v ? null : v;
  e.bozza = b; salva();
  document.querySelectorAll('.rir button').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.v) === b.rir)));
};
A.salvaEs = el => {
  const e = esDaUid(el.dataset.u), b = leggiBozza(e), err = [];
  let peso = null;
  if (e.tipoCarico !== 'corpo_libero') {
    peso = parseNum(b.peso);
    if (peso == null || peso < 0) err.push(e.tipoCarico === 'elastico' ? 'Inserisci i kg dell\'elastico (es. 10).' : 'Inserisci il peso in kg (es. 62,5).');
  }
  const serie = Number(b.serie), rip = Number(b.ripetizioni);
  if (!Number.isInteger(serie) || serie < 1) err.push('Le serie fatte devono essere un numero intero maggiore di 0.');
  if (!Number.isInteger(rip) || rip < 0) err.push('Le ripetizioni fatte devono essere un numero intero.');
  if (err.length) { $('#f-err').innerHTML = erroriHtml(err); $('#f-err').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  const giaFatto = e.stato === 'fatto';
  e.risultato = { peso, serie, ripetizioni: rip, rir: b.rir ?? null };
  e.stato = 'fatto'; e.bozza = null;
  salva();
  const riep = riepilogoEs(e);
  if (giaFatto) { vai('giorno'); toast('Aggiornato: ' + riep, 4500); return; }
  vaiAlProssimo(e, riep);
};
// riepilogo dopo il salvataggio: cosa ho fatto e differenza con l'ultima volta (niente volume)
function riepilogoEs(e) {
  const r = e.risultato;
  const parti = [pesoTesto(e, r), `${r.serie}×${r.ripetizioni}`, r.rir != null ? `RIR ${r.rir === 4 ? '4+' : r.rir}` : ''].filter(Boolean);
  let diff = '';
  const prima = e.tipoCarico === 'corpo_libero' ? ultimoRisultato(e.nome) : ultimoRisultato(e.nome, true);
  if (prima) {
    const d = e.tipoCarico === 'corpo_libero' ? r.ripetizioni - prima.ripetizioni : r.peso - prima.peso;
    const u = e.tipoCarico === 'corpo_libero' ? ' rip.' : ' kg';
    diff = d === 0 ? ' (come l\'ultima volta)' : ` (${d > 0 ? '+' : ''}${fmtN(d)}${u} rispetto all'ultima volta)`;
  }
  return `${e.nome}: ${parti.join(' · ')}${diff}`;
}
function vaiAlProssimo(e, msg) {
  const s = sess(), i = s.esercizi.indexOf(e);
  if (s.timer && s.timer.fine <= Date.now()) s.timer = null;
  const next = s.esercizi.slice(i + 1).find(x => x.stato === 'da_fare') || s.esercizi.find(x => x.stato === 'da_fare');
  const lungo = e.stato === 'fatto';
  if (next) { s.corrente = next.uid; salva(); vai('esercizio/' + next.uid); toast(`${lungo ? 'Salvato · ' : ''}${msg}. Ora: ${next.nome}`, lungo ? 4500 : 2600); }
  else { vai('giorno'); toast(`${lungo ? 'Salvato · ' + msg + '. ' : ''}Esercizi finiti: premi «Fine allenamento»`, lungo ? 4500 : 2600); }
}

}

function avviaTimer(e) { sess().timer = { fine: Date.now() + e.durata * 1000, durata: e.durata }; salva(); ridisegnaTimer(); }

// =====================================================================
//  PROGRESSI
// =====================================================================
const MESI = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
const rirTxt = v => v == null ? '' : 'RIR ' + (v >= 4 ? '4+' : v);
function lunedi(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
// una sessione appartiene alla scheda se ne porta l'identificativo; quelle registrate prima della versione 2 vanno alla scheda di allora
const sessDellaScheda = (s, sc) => s.schedaId ? s.schedaId === sc.id : !!sc.legacy;
const valoreEs = (r, tipo) => r == null ? null : tipo === 'corpo_libero' ? r.ripetizioni : r.peso;
const unitaBreve = tipo => tipo === 'corpo_libero' ? 'rip.' : 'kg';

// colonne del periodo: settimane della scheda, una settimana, settimane del mese, mesi dell'anno
function periodoProg() {
  const { periodo, offset } = S.prog, st = S.stato, sc = st.scheda, ora = new Date();
  const cicloAtt = st.ciclo || 1;
  if (periodo === 'scheda') {
    const ciclo = Math.max(1, cicloAtt + offset), corrente = ciclo === cicloAtt;
    const cols = Array.from({ length: sc.settimane }, (_, i) => ({
      lab: 'S' + (i + 1), lungo: 'SETT. ' + (i + 1), sett: i + 1,
      prende: s => s.settimana === i + 1,
      futura: corrente && i + 1 > st.settimana, attuale: corrente && i + 1 === st.settimana
    }));
    const sessioni = S.sessioni.filter(s => sessDellaScheda(s, sc) && (s.ciclo || 1) === ciclo);
    return {
      periodo, cols, sessioni, scheda: true, ciclo, previsti: sc.giorni.length * sc.settimane,
      etichetta: (cicloAtt > 1 ? `Ciclo ${ciclo} · ` : '') + `Settimane 1–${sc.settimane}`,
      indietro: ciclo > 1, avanti: !corrente
    };
  }
  let a, b, etichetta, cols;
  if (periodo === 'settimana') {
    a = lunedi(ora); a.setDate(a.getDate() + 7 * offset);
    b = new Date(a); b.setDate(a.getDate() + 7);
    const ult = new Date(b); ult.setDate(b.getDate() - 1);
    etichetta = `${dataBreve(a)} – ${dataBreve(ult)} ${ult.getFullYear()}`;
    cols = [{ lab: 'Sett.', lungo: 'SETTIMANA', da: a, a: b }];
  } else if (periodo === 'mese') {
    a = new Date(ora.getFullYear(), ora.getMonth() + offset, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 1);
    etichetta = cap(a.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }));
    cols = [];
    for (let l = lunedi(a); l < b; l = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 7)) {
      const da = l < a ? a : l, f = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 7), fine = f > b ? b : f;
      const ult = new Date(fine); ult.setDate(fine.getDate() - 1);
      cols.push({ lab: da.getDate() === ult.getDate() ? String(da.getDate()) : `${da.getDate()}–${ult.getDate()}`, lungo: `${dataBreve(da)} – ${dataBreve(ult)}`.toUpperCase(), da, a: fine });
    }
  } else {
    a = new Date(ora.getFullYear() + offset, 0, 1); b = new Date(a.getFullYear() + 1, 0, 1);
    etichetta = String(a.getFullYear());
    cols = MESI.map((m, i) => ({ lab: m, lungo: m.toUpperCase(), da: new Date(a.getFullYear(), i, 1), a: new Date(a.getFullYear(), i + 1, 1), attuale: offset === 0 && i === ora.getMonth() }));
  }
  cols.forEach(c => { c.prende = s => { const d = new Date(s.data); return d >= c.da && d < c.a; }; });
  const sessioni = S.sessioni.filter(s => { const d = new Date(s.data); return d >= a && d < b; });
  return { periodo, cols, sessioni, scheda: false, etichetta, indietro: true, avanti: offset < 0 };
}
function giorniProg(P) {
  const ids = S.stato.scheda.giorni.map(g => g.id);
  P.sessioni.forEach(s => { if (s.giorno && !ids.includes(s.giorno)) ids.push(s.giorno); });
  return ids;
}
function nomeGiornoProg(P, id) { return giornoScheda(id)?.nome || P.sessioni.find(s => s.giorno === id)?.nomeGiorno || 'Giorno ' + id; }

// una riga per esercizio, una cella per colonna
function righeProg(P, gid) {
  const g = giornoScheda(gid);
  const ssG = P.sessioni.filter(s => s.giorno === gid).sort((x, y) => new Date(x.data) - new Date(y.data));
  const mappa = new Map();
  (g?.esercizi || []).forEach(e => mappa.set(norm(e.nome), { nome: e.nome, sch: e, tipo: e.tipoCarico, categoria: e.categoria }));
  ssG.forEach(s => (s.esercizi || []).forEach(e => {
    const k = norm(e.nome);
    if (!mappa.has(k)) mappa.set(k, { nome: e.nome, sch: null, tipo: e.tipoCarico || 'kg', categoria: e.categoria || '', fuori: true });
  }));
  let righe = [...mappa.entries()].map(([k, x]) => {
    const celle = P.cols.map(c => {
      const ss = ssG.filter(c.prende);
      // se nella colonna ci sono più registrazioni (es. un mese) si prende il carico più alto
      let r = null;
      ss.forEach(s => (s.esercizi || []).forEach(e => {
        if (norm(e.nome) !== k) return;
        if (!r || (valoreEs(e, x.tipo) ?? -1) >= (valoreEs(r, x.tipo) ?? -1)) r = e;
      }));
      const saltato = !r && ss.some(s => (s.saltati || []).some(n => norm(n) === k));
      const prev = P.scheda && x.sch ? x.sch.settimane[c.sett - 1] || null : null;
      return { r, saltato, prev, futura: !!c.futura, attuale: !!c.attuale && P.scheda };
    });
    const vals = celle.map(c => valoreEs(c.r, x.tipo)).filter(v => v != null);
    const delta = vals.length > 1 ? vals.at(-1) - vals[0] : null;
    const rirT = x.sch ? x.sch.rir : (celle.find(c => c.r)?.r.previsto?.rir || '');
    return { key: k, ...x, celle, delta, nVal: vals.length, rirT };
  });
  if (!P.scheda) righe = righe.filter(r => r.celle.some(c => c.r || c.saltato));
  return righe;
}
function sintesiProg(P) {
  const tutte = giorniProg(P).flatMap(id => righeProg(P, id));
  const confr = tutte.filter(r => r.tipo === 'kg' && r.nVal > 1);
  return {
    allenamenti: P.sessioni.length, previsti: P.previsti,
    aumento: confr.filter(r => r.delta > 0).length, confrontabili: confr.length,
    saltati: P.sessioni.reduce((t, s) => t + (s.saltati?.length || 0), 0)
  };
}
const diversoDaPrevisto = r => !!(r?.previsto && (r.serie !== r.previsto.serie || r.ripetizioni !== r.previsto.ripetizioni));

function cellaHtml(c, col, tipo) {
  const cur = c.attuale ? ' cur' : '';
  if (c.r) {
    const v = valoreEs(c.r, tipo), dv = diversoDaPrevisto(c.r);
    return `<div class="pc${cur}"><span class="pl">${esc(col.lab)}</span><span class="pv">${v == null ? '—' : fmtN(v)}</span>`
      + `<span class="ps${dv ? ' diff' : ''}"${dv ? ` title="Previsto ${c.r.previsto.serie}×${c.r.previsto.ripetizioni}"` : ''}>${c.r.serie}×${c.r.ripetizioni}</span>`
      + `<span class="pr">${rirTxt(c.r.rirPercepito) || '&#160;'}</span></div>`;
  }
  if (c.saltato) return `<div class="pc vuota${cur}"><span class="pl">${esc(col.lab)}</span><span class="pv">—</span><span class="ps sk">saltato</span><span class="pr">&#160;</span></div>`;
  const p = c.prev;
  return `<div class="pc vuota${cur}"><span class="pl">${esc(col.lab)}</span><span class="pv">—</span><span class="ps">${p ? p.serie + '×' + p.ripetizioni : '&#160;'}</span><span class="pr">${p?.nota ? esc(p.nota) : '&#160;'}</span></div>`;
}
function badgeProg(r) {
  const u = unitaBreve(r.tipo);
  if (r.tipo === 'elastico') return '<span class="chip">Elastico</span>';
  if (r.delta == null) return r.tipo === 'corpo_libero' ? '<span class="chip">Corpo libero</span>' : '';
  if (r.delta > 0) return `<span class="chip ok">+${fmtN(r.delta)} ${u}</span>`;
  if (r.delta < 0) return `<span class="chip">${fmtN(r.delta)} ${u}</span>`;

}
function cardEsProg(r, P) {
  const unita = r.tipo === 'corpo_libero' ? 'ripetizioni' : r.tipo === 'elastico' ? 'kg elastico' : 'kg';
  const meta = [r.categoria, unita, r.rirT ? 'RIR target ' + r.rirT : '', r.fuori ? 'fuori scheda' : ''].filter(Boolean).join(' · ');
  const n = P.cols.length;

    } else griglia = '<div class="pone">Saltato</div>';

  }

    <div class="between" style="align-items:flex-start"><div class="head"><span style="font-size:15px;font-weight:800">${esc(r.nome)}</span><span class="pmeta">${esc(meta)}</span></div>${badgeProg(r)}</div>

A.progPer = el => { S.prog.periodo = el.dataset.v; S.prog.offset = 0; render(); };
A.progNav = el => {

  const min = S.prog.periodo === 'scheda' ? 1 - (S.stato.ciclo || 1) : -Infinity;
  S.prog.offset = Math.max(min, Math.min(0, S.prog.offset + d)); render();
};
A.progGiorno = el => { S.prog.giorno = el.dataset.v; render(); };
A.scaricaReport = () => scaricaReport();
DOPO.progressi = () => {
  libPdf().catch(() => { });
  // con molte colonne (es. anno) la griglia scorre: la apro sul mese corrente o sull'ultimo con dati
  const P = periodoProg();
  const idx = P.cols.findIndex(c => c.attuale);
  document.querySelectorAll('.pscroll').forEach(box => {
    const celle = [...box.querySelectorAll('.pc')];
    let i = idx;
    if (i < 0) { const piene = celle.map((c, k) => c.classList.contains('vuota') ? -1 : k).filter(k => k >= 0); i = piene.length ? piene.at(-1) : 0; }
    const el = celle[i];
    if (el) box.scrollLeft = Math.max(0, el.offsetLeft - box.offsetLeft + el.offsetWidth - box.clientWidth + 8);
  });
};

// ---------- dettaglio di un esercizio ----------
let PE = null;
VISTE.progEs = key => {
  const regs = sessOrdinate().flatMap(s => (s.esercizi || []).filter(e => norm(e.nome) === key)
    .map(e => ({ ...e, data: new Date(s.data), settimana: s.settimana, nomeGiorno: s.nomeGiorno })));
  const sch = S.stato.scheda.giorni.flatMap(g => g.esercizi).find(e => norm(e.nome) === key);
  const nome = sch?.nome || regs.at(-1)?.nome || key;
  const tipo = sch?.tipoCarico || regs.at(-1)?.tipoCarico || 'kg';
  const u = unitaBreve(tipo);
  const pts = regs.map(r => ({ x: dataBreve(r.data), y: valoreEs(r, tipo) })).filter(p => p.y != null);
  const rirPts = regs.filter(r => r.rirPercepito != null).map(r => ({ x: dataBreve(r.data), y: r.rirPercepito }));
  const rirT = sch?.rir || regs.at(-1)?.previsto?.rir || '';
  const nums = (rirT.match(/\d+(?:[.,]\d+)?/g) || []).map(parseNum);
  const target = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
  PE = { pts, u, rirPts, target };
  const prima = pts[0]?.y, ult = pts.at(-1)?.y, dlt = pts.length > 1 ? ult - prima : null;
  const colD = dlt == null || tipo === 'elastico' ? 'inherit' : dlt > 0 ? 'var(--ok-ink)' : dlt < 0 ? 'var(--acc)' : 'inherit';
  const nota = S.note[key]?.testo;
  const ultVol = tipo === 'kg' ? [...regs].reverse().find(r => r.peso > 0) : null;
  const storico = [...regs].reverse().map(r => {
    const v = valoreEs(r, tipo), dv = diversoDaPrevisto(r);
    return `<div class="hrow">
      <span class="hd">${esc(r.data.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }))}<small>${esc(r.nomeGiorno || '')}${r.settimana ? ' · sett. ' + r.settimana : ''}</small></span>
      <span class="hv">${v == null ? '—' : fmtN(v) + ' ' + u}</span>
      <span class="hs"><b${dv ? ' style="color:var(--acc)"' : ''}>${r.serie}×${r.ripetizioni}</b>${dv ? ` (previsto ${r.previsto.serie}×${r.previsto.ripetizioni})` : ''}${r.rirPercepito != null ? ' · ' + rirTxt(r.rirPercepito) : ''}${r.previsto?.rir ? ` (target ${esc(r.previsto.rir)})` : ''}</span>
    </div>`;
  }).join('');
  const vuoto = m => `<div class="empty">${m}</div>`;
  return `<div class="scr sub nav">
    <div class="topbar"><a class="iconbtn" href="#progressi" aria-label="Torna ai progressi">${ico('chevL')}</a>
      <div class="tt"><h1>${esc(nome)}</h1><span class="sub">${esc([sch?.categoria, TIPI[tipo]].filter(Boolean).join(' · '))}</span></div></div>
    <div class="grid3" style="gap:8px">
      <div class="tile"><span class="k">Prima volta</span><span class="v">${prima != null ? fmtN(prima) + '<small> ' + u + '</small>' : '—'}</span></div>
      <div class="tile"><span class="k">Ultima volta</span><span class="v">${ult != null ? fmtN(ult) + '<small> ' + u + '</small>' : '—'}</span></div>
      <div class="tile"><span class="k">Variazione</span><span class="v" style="color:${colD}">${dlt != null ? (dlt > 0 ? '+' : '') + fmtN(dlt) + '<small> ' + u + '</small>' : '—'}</span></div>
    </div>
    ${tipo === 'elastico' ? '<p class="hint" style="font-size:12px">Esercizio con elastico: i kg sono quelli dell\'elastico. Se l\'elastico ti aiuta (es. trazioni assistite), meno kg vuol dire che stai migliorando.</p>' : ''}
    <div class="card" style="gap:12px">
      <span class="eyebrow" style="letter-spacing:.5px">${tipo === 'corpo_libero' ? 'Ripetizioni nel tempo' : 'Carico nel tempo'}</span>
      ${pts.length ? '<div class="chartbox"><canvas id="ch-peso" role="img" aria-label="Andamento del carico"></canvas></div>' : vuoto('Ancora nessun dato per questo esercizio.')}
    </div>
    <div class="card" style="gap:12px">
      <span class="eyebrow" style="letter-spacing:.5px">RIR percepito</span>
      <div class="legend"><span><span style="width:18px;height:3px;background:var(--acc);border-radius:2px"></span>Percepito</span>${target != null ? `<span><span style="width:18px;border-top:2px dashed var(--mut)"></span>Target (RIR ${esc(rirT)})</span>` : ''}</div>
      ${rirPts.length ? '<div class="chartbox"><canvas id="ch-rir" role="img" aria-label="RIR percepito nel tempo"></canvas></div>' : vuoto('Nessun RIR registrato.')}
    </div>
    ${nota ? `<div class="card sm"><span class="k-up">Le mie note</span><span style="font-size:14px;line-height:1.45">${esc(nota)}</span></div>` : ''}
    <div class="card" style="gap:0">
      <span class="eyebrow" style="letter-spacing:.5px;margin-bottom:4px">Tutte le volte (${regs.length})</span>
      ${storico || vuoto('Ancora nessuna registrazione.')}
    </div>
    ${ultVol ? `<p class="hint" style="font-size:12px;text-align:center">Volume dell'ultima volta: ${fmtInt(ultVol.peso * ultVol.ripetizioni * ultVol.serie)} kg (kg × ripetizioni × serie)</p>` : ''}
  </div>`;
};
DOPO.progEs = () => {
  if (!window.Chart || !PE) return;
  Chart.defaults.font.family = "'Manrope', system-ui, sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = '#5A5F69';
  if (PE.pts.length) graficoLinea('ch-peso', PE.pts, PE.u);
  if (PE.rirPts.length) {
    const max = Math.max(4, ...PE.rirPts.map(p => p.y), PE.target ?? 0);
    graficoLinea('ch-rir', PE.rirPts, 'RIR', { target: PE.target, min: 0, max, step: 1 });
  }
};

function distruggiGrafici() { S.grafici.forEach(g => g.destroy()); S.grafici = []; }
function graficoLinea(id, punti, unita, opz = {}) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  const n = punti.length, last = n - 1;
  const ds = [{
    data: punti.map(p => p.y), borderColor: '#B93D0B', borderWidth: 3, tension: 0,
    pointRadius: punti.map((_, i) => i === last ? 5.5 : 4.5), pointBackgroundColor: punti.map((_, i) => i === last ? '#B93D0B' : '#FFFFFF'),
    pointBorderColor: '#B93D0B', pointBorderWidth: 2.5, pointHoverRadius: 7
  }];
  if (opz.target != null) ds.push({ data: punti.map(() => opz.target), borderColor: '#5A5F69', borderWidth: 1.5, borderDash: [5, 5], pointRadius: 0, pointHoverRadius: 0 });
  S.grafici.push(new Chart(el, {
    type: 'line', data: { labels: punti.map(p => p.x), datasets: ds },
    options: {
      maintainAspectRatio: false, animation: false, layout: { padding: { top: 8, right: 8 } },
      plugins: { legend: { display: false }, tooltip: { filter: it => it.datasetIndex === 0, displayColors: false, callbacks: { label: c => `${fmtN(c.parsed.y)} ${unita}` } } },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
        y: { grid: { color: '#EEEDE8' }, border: { display: false }, ticks: { maxTicksLimit: 5, stepSize: opz.step, callback: v => fmtN(v) }, min: opz.min, max: opz.max, grace: opz.min == null ? '10%' : 0 }
      }
    }
  }));
}

// ---------- report PDF per il personal trainer ----------
const JSPDF_URL = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
const AUTOTABLE_URL = 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js';
function caricaScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { s.remove(); ko(new Error('Script non caricato: ' + src)); }; document.head.appendChild(s); });
}
let pdfPronto = null;
function libPdf() {
  if (!pdfPronto) pdfPronto = (async () => {
    if (!window.jspdf?.jsPDF) await caricaScript(JSPDF_URL);
    if (!window.jspdf.jsPDF.API.autoTable) await caricaScript(AUTOTABLE_URL);
    return window.jspdf.jsPDF;
  })().catch(e => { pdfPronto = null; throw e; });
  return pdfPronto;
}
// i caratteri standard del PDF coprono solo l'alfabeto latino: sostituisco trattini e virgolette "tipografiche"
const pdfT = s => String(s ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '');

async function scaricaReport() {
  const P = periodoProg();
  if (!P.sessioni.length) { toast('Nessun allenamento registrato nel periodo'); return; }
  toast('Preparo il PDF…', 8000);
  let jsPDF;
  try { jsPDF = await libPdf(); }
  catch (e) { console.error(e); toast('Non riesco a creare il PDF: controlla la connessione e riprova', 4000); return; }

  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), M = 30;
  const INK = [23, 25, 30], MUT = [90, 95, 105], MUT2 = [63, 68, 77], ACC = [185, 61, 11], OK = [31, 107, 64], LINE = [228, 226, 220], GRIGIO = [160, 162, 168];
  const st = S.stato, sc = st.scheda;
  const persona = S.utente?.displayName || '';
  const titolo = [persona, sc.obiettivo ? 'Scheda ' + sc.obiettivo : sc.nome].filter(Boolean).join(' · ');
  const date = P.sessioni.map(s => new Date(s.data)).sort((a, b) => a - b);
  const fmtD = d => d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
  const periodoTxt = fmtD(date[0]) === fmtD(date.at(-1)) ? fmtD(date[0]) : `${fmtD(date[0])} - ${fmtD(date.at(-1))}`;
  const sin = sintesiProg(P);
  const settFatte = P.scheda ? [...new Set(P.sessioni.map(s => s.settimana))].sort((a, b) => a - b) : [];

  // intestazione
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...ACC);
  doc.text('REPORT PROGRESSI' + (P.scheda && (st.ciclo || 1) > 1 ? ` · CICLO ${P.ciclo}` : ''), M, M + 6);
  doc.setFontSize(17); doc.setTextColor(...INK);
  doc.text(pdfT(titolo), M, M + 26);
  const info = [
    ['Periodo', periodoTxt],
    P.scheda ? ['Settimane', settFatte.length ? `${settFatte[0] === settFatte.at(-1) ? settFatte[0] : settFatte[0] + '-' + settFatte.at(-1)} di ${sc.settimane}` : '-'] : ['Vista', cap(P.periodo) + ' · ' + P.etichetta],
    ['Allenamenti', P.scheda ? `${sin.allenamenti} di ${sin.previsti} previsti` : String(sin.allenamenti)],
    ['Esercizi saltati', String(sin.saltati)]
  ];
  let x = W - M;
  for (const [k, v] of [...info].reverse()) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); const wv = doc.getTextWidth(pdfT(v));
    doc.setFontSize(7.5); const wk = doc.getTextWidth(k);
    const w = Math.max(wv, wk);
    x -= w;
    doc.setTextColor(...MUT); doc.setFontSize(7.5); doc.text(k, x, M + 12);
    doc.setTextColor(...INK); doc.setFontSize(10.5); doc.text(pdfT(v), x, M + 26);
    x -= 22;
  }
  doc.setDrawColor(...ACC); doc.setLineWidth(2); doc.line(M, M + 36, W - M, M + 36);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUT2);
  const legenda = 'Ogni cella: carico usato (un peso unico per esercizio) - serie x ripetizioni eseguite - RIR percepito. In arancio le serie x ripetizioni diverse da quelle previste. '
    + (P.scheda ? 'Settimane non svolte: prescrizione della scheda (prev.).' : P.periodo === 'anno' ? 'Per ogni mese il carico più alto usato.' : P.periodo === 'mese' ? 'Colonne = settimane del mese.' : '');
  doc.text(doc.splitTextToSize(pdfT(legenda), W - 2 * M), M, M + 50);

  // tabelle: una per giorno
  const nCol = P.cols.length;
  const wNome = 150, wTarget = 74, wVar = 60;
  const wCella = (W - 2 * M - wNome - wTarget - wVar) / nCol;
  const stretta = wCella < 72;
  const L = (t, o = {}) => ({ t: pdfT(t), s: o.s || 8, b: !!o.b, c: o.c || INK, r: !!o.r });
  const cellaPdf = (c, tipo) => {
    if (c.r) {
      const v = valoreEs(c.r, tipo), dv = diversoDaPrevisto(c.r);
      const sr = `${c.r.serie}×${c.r.ripetizioni}`, rir = rirTxt(c.r.rirPercepito);
      const righe = [L(v == null ? '-' : `${fmtN(v)} ${unitaBreve(tipo)}`, { s: 9.5, b: true })];
      if (stretta) { righe.push(L(sr, { s: 7.5, c: dv ? ACC : MUT2, b: dv })); if (rir) righe.push(L(rir, { s: 7.5, c: MUT2 })); }
      else righe.push(L(sr + (rir ? ' · ' + rir : ''), { s: 7.5, c: dv ? ACC : MUT2, b: dv }));
      return righe;
    }
    if (c.saltato) return [L('saltato', { s: 8, b: true, c: ACC })];
    if (c.prev) return [L('-', { s: 9, c: GRIGIO }), L(`prev. ${c.prev.serie}×${c.prev.ripetizioni}${c.prev.nota ? ' ' + c.prev.nota : ''}`, { s: 7, c: MUT })];
    return [L('-', { s: 9, c: GRIGIO })];
  };
  const cella = (linee, extra = {}) => ({ content: linee.map(l => l.t || ' ').join('\n'), linee, ...extra });
  const chiavi = new Set();
  let y = M + 62;
  for (const gid of giorniProg(P)) {
    const righe = righeProg(P, gid).filter(r => P.scheda || r.nVal || r.celle.some(c => c.saltato));
    if (!righe.length) continue;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    const body = righe.map(r => {
      chiavi.add(r.key);
      const sub = [r.categoria, r.tipo !== 'kg' ? TIPI[r.tipo] : '', r.fuori ? 'fuori scheda' : ''].filter(Boolean).join(' · ');
      const nomeLinee = doc.splitTextToSize(pdfT(r.nome), wNome - 10).map(t => L(t, { s: 9, b: true }));
      const p = r.sch ? pianoSett(r.sch) : null;
      const rec = r.sch ? recSett(r.sch, p) : 0;
      const varTxt = r.delta == null ? '' : r.delta === 0 ? '=' : `${r.delta > 0 ? '+' : ''}${fmtN(r.delta)} ${unitaBreve(r.tipo)}`;
      const varCol = r.tipo !== 'elastico' && r.delta > 0 ? OK : INK;
      return [
        cella([...nomeLinee, L(sub, { s: 7, c: MUT })]),
        cella([L(r.rirT ? 'RIR ' + r.rirT : 'RIR -', { s: 7.5, c: MUT2 }), L(rec ? 'Rec. ' + fmtRec(rec) : '', { s: 7.5, c: MUT2 })]),
        ...r.celle.map(c => cella(cellaPdf(c, r.tipo), { futura: c.futura })),
        cella([L(varTxt + (r.tipo === 'elastico' && varTxt ? ' (el.)' : ''), { s: 9.5, b: true, c: varCol, r: true })])
      ];
    });
    const colStyles = { 0: { cellWidth: wNome }, 1: { cellWidth: wTarget }, [nCol + 2]: { cellWidth: wVar } };
    for (let i = 0; i < nCol; i++) colStyles[i + 2] = { cellWidth: wCella };
    doc.autoTable({
      startY: y, margin: { left: M, right: M, top: M, bottom: 34 }, theme: 'plain',
      head: [[pdfT(nomeGiornoProg(P, gid)), 'TARGET', ...P.cols.map(c => pdfT(c.lungo)), { content: 'VARIAZIONE', styles: { halign: 'right' } }]],
      body, columnStyles: colStyles, rowPageBreak: 'avoid', showHead: 'everyPage',
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: { top: 5, bottom: 5, left: 5, right: 5 }, textColor: INK, lineColor: LINE, lineWidth: { bottom: 0.6 }, minCellHeight: 28, valign: 'top' },
      headStyles: { fontStyle: 'bold', fontSize: 7, textColor: MUT, lineColor: INK, lineWidth: { bottom: 1.2 }, fillColor: false, minCellHeight: 0 },
      didParseCell: d => {
        if (d.section === 'head' && d.column.index === 0) { d.cell.styles.fontSize = 11; d.cell.styles.textColor = INK; }
        if (d.section === 'body' && d.cell.raw?.futura) d.cell.styles.fillColor = [250, 250, 247];
      },
      willDrawCell: d => { if (d.section === 'body' && d.cell.raw?.linee) d.cell.text = []; },
      didDrawCell: d => {
        if (d.section !== 'body' || !d.cell.raw?.linee) return;
        const { x: cx, y: cy, width } = d.cell, pad = 5;
        let yy = cy + pad;
        for (const l of d.cell.raw.linee) {
          if (!l.t) { yy += l.s * 1.2; continue; }
          doc.setFont('helvetica', l.b ? 'bold' : 'normal'); doc.setFontSize(l.s); doc.setTextColor(...l.c);
          yy += l.s * 0.95;
          doc.text(l.t, l.r ? cx + width - pad : cx + pad, yy, { align: l.r ? 'right' : 'left' });
          yy += l.s * 0.3;
        }
      }
    });
    y = doc.lastAutoTable.finalY + 16;
  }

  // note personali sugli esercizi del report
  const note = Object.entries(S.note).filter(([k, v]) => chiavi.has(k) && str(v?.testo));
  if (note.length) {
    doc.autoTable({
      startY: y, margin: { left: M, right: M, top: M, bottom: 34 }, theme: 'plain', rowPageBreak: 'avoid',
      head: [[persona ? `Note di ${pdfT(persona.split(' ')[0])}` : 'Note personali', '']],
      body: note.map(([, v]) => [pdfT(v.nome), pdfT(v.testo)]),
      columnStyles: { 0: { cellWidth: 200, fontStyle: 'bold' } },
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 5, textColor: INK, lineColor: LINE, lineWidth: { bottom: 0.6 } },
      headStyles: { fontStyle: 'bold', fontSize: 11, lineColor: INK, lineWidth: { bottom: 1.2 }, fillColor: false }
    });
  }

  // piè di pagina
  const nPag = doc.internal.getNumberOfPages();
  const oggi = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
  for (let i = 1; i <= nPag; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...MUT);
    const h = doc.internal.pageSize.getHeight();
    doc.text(`Pagina ${i} di ${nPag}`, M, h - 16);
    doc.text(pdfT(`${sc.nome} · generato il ${oggi}`), W - M, h - 16, { align: 'right' });
  }

  const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  const parte = P.scheda ? (settFatte.length ? `sett${settFatte[0]}-${settFatte.at(-1)}` : '') : slug(P.etichetta);
  const nomeFile = ['Progressi', slug(persona), slug(sc.obiettivo || sc.nome), parte].filter(Boolean).join('_') + '.pdf';
  const blob = doc.output('blob');
  const file = new File([blob], nomeFile, { type: 'application/pdf' });
  // sul telefono si apre la condivisione (es. WhatsApp); altrimenti il file si scarica
  const telefono = matchMedia('(pointer: coarse)').matches;
  if (telefono && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Report progressi' }); toast('Report pronto'); return; }
    catch (e) { if (e?.name === 'AbortError') { toast('Condivisione annullata'); return; } }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeFile;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast('Report scaricato: ' + nomeFile, 4000);
}
