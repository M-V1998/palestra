  const g = giornoScheda(S.modTab), i = Number(el.dataset.i);
  if (g.esercizi.length === 1) { toast('Un giorno deve avere almeno un esercizio'); return; }
  if (!await conferma({ titolo: 'Eliminare dalla scheda?', testo: `«${g.esercizi[i].nome}» verrà tolto in modo permanente da ${g.nome}. Lo storico già registrato resta.`, ok: 'Elimina', pericolo: true })) return;
  g.esercizi.splice(i, 1);
  salva(); render(); toast('Esercizio eliminato');
};
A.riscSposta = el => {
  const sz = S.stato.scheda.riscaldamento[Number(el.dataset.s)], i = Number(el.dataset.i), j = i + Number(el.dataset.d);
  if (j < 0 || j >= sz.esercizi.length) return;
  [sz.esercizi[i], sz.esercizi[j]] = [sz.esercizi[j], sz.esercizi[i]];
  salva(); render();
};
A.modRisc = el => {
  const si = Number(el.dataset.s), i = Number(el.dataset.i), sz = S.stato.scheda.riscaldamento[si], nuovo = i < 0;
  const e = nuovo ? { nome: '', prescrizione: '', videoUrl: '' } : sz.esercizi[i];
  apriFoglio(`<h2>${nuovo ? 'Nuovo esercizio' : 'Modifica esercizio'}</h2><p class="hint">Riscaldamento · ${esc(sz.sezione)}</p>
    <div class="fld"><label for="r-nome">Nome</label><input class="inp" id="r-nome" value="${esc(e.nome)}"></div>
    <div class="fld"><label for="r-pre">Prescrizione</label><input class="inp" id="r-pre" value="${esc(e.prescrizione)}" placeholder="es. 1x12 per lato"></div>
    <div class="fld"><label for="r-video">Link video YouTube</label><input class="inp" id="r-video" inputmode="url" value="${esc(e.videoUrl)}"></div>
    <div id="r-err"></div>
    <button class="btn-pri" data-a="salvaRisc" data-s="${si}" data-i="${i}">${nuovo ? 'Aggiungi' : 'Salva modifiche'}</button>
    ${nuovo ? '' : `<button class="btn-danger" data-a="eliminaRisc" data-s="${si}" data-i="${i}">${ico('trash', 18)}Elimina</button>`}
    <button class="btn-txt" data-a="chiudiFoglio">Annulla</button>`);
};
A.salvaRisc = el => {
  const sz = S.stato.scheda.riscaldamento[Number(el.dataset.s)], i = Number(el.dataset.i);
  const e = { nome: str($('#r-nome').value), prescrizione: str($('#r-pre').value), videoUrl: str($('#r-video').value) };
  if (!e.nome) { $('#r-err').innerHTML = erroriHtml(['Scrivi il nome dell\'esercizio.']); return; }
  if (i < 0) sz.esercizi.push(e); else sz.esercizi[i] = e;
  salva(); chiudiFoglio(); render(); toast('Riscaldamento aggiornato');
};
A.eliminaRisc = async el => {
  const sz = S.stato.scheda.riscaldamento[Number(el.dataset.s)], i = Number(el.dataset.i);
  if (!await conferma({ titolo: 'Eliminare l\'esercizio?', testo: `«${sz.esercizi[i].nome}» verrà tolto dal riscaldamento.`, ok: 'Elimina', pericolo: true })) return;
  sz.esercizi.splice(i, 1); salva(); render(); toast('Esercizio eliminato');
};
A.modSez = el => {
  const si = Number(el.dataset.s), nuovo = si < 0, sz = nuovo ? { sezione: '', esercizi: [] } : S.stato.scheda.riscaldamento[si];
  apriFoglio(`<h2>${nuovo ? 'Nuova sezione' : 'Sezione del riscaldamento'}</h2>
    <div class="fld"><label for="z-nome">Nome della sezione</label><input class="inp" id="z-nome" value="${esc(sz.sezione)}" placeholder="es. Mobilità"></div>
    <button class="btn-pri" data-a="salvaSez" data-s="${si}">${nuovo ? 'Crea sezione' : 'Salva'}</button>
    ${nuovo ? '' : `<div class="grid2"><button class="btn-sec" data-a="spostaSez" data-s="${si}" data-d="-1">${ico('up', 18)}Su</button><button class="btn-sec" data-a="spostaSez" data-s="${si}" data-d="1">${ico('down', 18)}Giù</button></div>
      <button class="btn-danger" data-a="eliminaSez" data-s="${si}">${ico('trash', 18)}Elimina sezione</button>`}
    <button class="btn-txt" data-a="chiudiFoglio">Annulla</button>`);
};
A.salvaSez = el => {
  const si = Number(el.dataset.s), nome = str($('#z-nome').value);
  if (!nome) { toast('Scrivi il nome della sezione'); return; }
  if (si < 0) S.stato.scheda.riscaldamento.push({ sezione: nome, esercizi: [] }); else S.stato.scheda.riscaldamento[si].sezione = nome;
  salva(); chiudiFoglio(); render();
};
A.spostaSez = el => {
  const r = S.stato.scheda.riscaldamento, i = Number(el.dataset.s), j = i + Number(el.dataset.d);
  if (j < 0 || j >= r.length) return;
  [r[i], r[j]] = [r[j], r[i]]; salva(); chiudiFoglio(); render();
};
A.eliminaSez = async el => {
  const r = S.stato.scheda.riscaldamento, si = Number(el.dataset.s);
  if (!await conferma({ titolo: 'Eliminare la sezione?', testo: `«${r[si].sezione}» e i suoi ${r[si].esercizi.length} esercizi verranno tolti dal riscaldamento.`, ok: 'Elimina sezione', pericolo: true })) return;
  r.splice(si, 1); salva(); render(); toast('Sezione eliminata');
};

// =====================================================================
//  ACCESSO E AVVIO
// =====================================================================
function vistaAccesso(msg = '') {
  schermata(`<div class="scr center">
    <div class="card" style="padding:24px;gap:16px">
      <span class="ic" style="width:56px;height:56px;border-radius:16px">${ico('pulse', 28)}</span>
      <div class="head"><h1 class="big">La mia scheda</h1><span class="date">Allenamento del giorno, timer e progressi</span></div>
      <p class="txt">Accedi con il tuo account Google per vedere la scheda e salvare gli allenamenti.</p>
      <button class="btn-pri" data-a="accedi">Accedi con Google</button>
      ${msg ? `<div class="err">${msg}</div>` : ''}
    </div></div>`);
}
function vistaErrore(titolo, msg, conEsci) {
  schermata(`<div class="scr center"><div class="card" style="padding:24px">
    <h1 style="margin:0;font-size:22px;font-weight:800">${esc(titolo)}</h1><p class="txt">${msg}</p>
    ${conEsci ? '<button class="btn-sec" data-a="esci">Esci e cambia account</button>' : '<button class="btn-pri" data-a="ricarica">Riprova</button>'}
  </div></div>`);
}
A.ricarica = () => location.reload();
A.esci = () => FBX?.A.signOut(FBX.auth);
A.accedi = async () => {
  try { await FBX.A.signInWithPopup(FBX.auth, new FBX.A.GoogleAuthProvider()); }
  catch (e) {
    if (['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) return;
    const m = {
      'auth/unauthorized-domain': 'Questo indirizzo non è tra i «Domini autorizzati» di Firebase. Aggiungilo in Authentication › Impostazioni (vedi la guida).',
      'auth/popup-blocked': 'Il browser ha bloccato la finestra di accesso. Consenti i popup per questo sito e riprova.',
      'auth/network-request-failed': 'Connessione assente o instabile. Riprova.',
      'auth/operation-not-allowed': 'L\'accesso con Google non è attivo nel progetto Firebase (vedi la guida).'
    }[e.code] || `Accesso non riuscito (${esc(e.code || e.message)}).`;
    vistaAccesso(m);
  }
};

async function caricaDati() {
  try {
    const d = await S.archivio.carica();
    S.sessioni = d.sessioni || []; S.note = d.note || {};
    S.stato = d.stato ? completaStato(d.stato) : null;
    if (!S.stato) { S.stato = statoIniziale(); await S.archivio.salvaStato(S.stato); }
    else if (S.stato._daSalvare) { delete S.stato._daSalvare; await S.archivio.salvaStato(S.stato); }
  } catch (e) {
    console.error(e);
    S.stato = null;
    if (e?.code === 'permission-denied') vistaErrore('Account non autorizzato', `L'account <b>${esc(S.utente?.email || '')}</b> non può usare questa app. Accedi con il tuo account Google.`, true);
    else vistaErrore('Impossibile caricare i dati', 'Controlla la connessione e riprova.', false);
    return;
  }
  render();
  const r = rotta().nome;
  const s = sess();
  if (s && r !== 'giorno' && r !== 'esercizio') {
    const di = new Date(s.inizio);
    const quando = (di.toDateString() === new Date().toDateString() ? 'oggi' : di.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })) + ' alle ' + di.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    if (await conferma({ titolo: 'Allenamento in corso', testo: `Hai un allenamento non concluso: ${s.nomeGiorno}, iniziato ${quando}. Vuoi riprenderlo?`, ok: 'Riprendi allenamento', annulla: 'Più tardi' })) vai('giorno');
  }
}

async function avvio() {
  if (!FIREBASE_CONFIG.apiKey) { S.archivio = creaArchivioLocale(); await caricaDati(); return; }
  try {
    const [app, auth, fs] = await Promise.all([import(FB_URL + 'firebase-app.js'), import(FB_URL + 'firebase-auth.js'), import(FB_URL + 'firebase-firestore.js')]);
    const fa = app.initializeApp(FIREBASE_CONFIG);
    FBX = { A: auth, F: fs, auth: auth.getAuth(fa), db: fs.getFirestore(fa) };
    FBX.auth.languageCode = 'it';
  } catch (e) { console.error(e); vistaErrore('Impossibile avviare l\'app', 'Non riesco a caricare Firebase. Controlla la connessione e riprova.', false); return; }
  FBX.A.onAuthStateChanged(FBX.auth, async u => {
    chiudiFoglio();
    S.utente = u; S.stato = null;
    if (!u) { vistaAccesso(); return; }
    schermata('<div class="scr center"><p class="hint" style="text-align:center">Caricamento dei tuoi dati…</p></div>');
    S.archivio = creaArchivioFirebase(u);
    await caricaDati();
  });
}
avvio();
</script>
